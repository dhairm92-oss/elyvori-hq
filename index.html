<!doctype html>

    <!-- ELYVORI-OAUTH-BOOT -->
    <script>(function(){try{var h=location.hash;if(!h||h.indexOf('elyvori_auth')<0)return;var p=new URLSearchParams(h.slice(1));var tok=p.get('elyvori_auth');var err=p.get('elyvori_auth_error');if(tok){localStorage.setItem('elyvori_token',tok);var em=p.get('email');if(em)localStorage.setItem('elyvori_user',em);var org=p.get('org');if(org)localStorage.setItem('elyvori_org',org);}if(err){sessionStorage.setItem('elyvori_oauth_error',err);sessionStorage.setItem('elyvori_oauth_reopen','1');}history.replaceState(null,'',location.pathname+location.search);}catch(e){}})();</script>

    <meta charset="UTF-8" />

    <!-- ELYVORI-THEME-BOOT -->
    <meta name="theme-color" content="#080A12" />
    <script>(function(){try{var t=localStorage.getItem('elyvori_theme');var d=t!=='light';var r=document.documentElement;r.classList.toggle('dark',d);r.classList.toggle('light',!d);r.style.colorScheme=d?'dark':'light';var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',d?'#080A12':'#F6F8FC');}catch(e){}})();</script>
