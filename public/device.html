.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:11px}

main{max-width:1180px;margin:0 auto;padding:26px 20px calc(80px + var(--safe-b))}

.stat{padding:16px 18px}

.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:600;margin-bottom:14px;min-height:36px}

.mbar{display:none}

.panel{padding:28px}
.center{text-align:center}

.badge-ico svg{width:30px;height:30px}

  function email() { try { return (JSON.parse(get('elyvori_user') || '{}') || {}).email || ''; } catch (e) { return ''; } }
  function api(path, opts) {
    opts = opts || {};
    var h = { 'Content-Type': 'application/json' };
    if (opts.auth) h.Authorization = 'Bearer ' + token();
    return fetch(API + path, { method: opts.method || 'GET', headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { s: r.status, j: j }; }); });
  }
  function steps(n) { return '<div class="steps3" aria-label="' + esc(t().step) + ' ' + n + '/3"><i class="' + (n >= 1 ? 'on' : '') + '"></i><i class="' + (n >= 2 ? 'on' : '') + '"></i><i class="' + (n >= 3 ? 'on' : '') + '"></i></div>'; }
  function codeBox() { return '<div class="code"><span>' + esc(code) + '</span></div>'; }

  function chrome() {
    document.title = t().title + ' | Elyvori';
    var dark = !html.classList.contains('light');
    var lb = document.getElementById('langBtn'), tb = document.getElementById('themeBtn');
    lb.textContent = lang === 'ar' ? 'EN' : 'ع'; lb.setAttribute('aria-label', lang === 'ar' ? 'English' : 'العربية'); lb.title = lb.getAttribute('aria-label');
    tb.innerHTML = dark ? I.sun : I.moon; tb.setAttribute('aria-label', dark ? 'Light mode' : 'Dark mode'); tb.title = tb.getAttribute('aria-label');
  }
  document.getElementById('langBtn').onclick = function () { lang = lang === 'ar' ? 'en' : 'ar'; set('elyvori_lang', lang); html.lang = lang; html.dir = lang === 'ar' ? 'rtl' : 'ltr'; chrome(); if (view) view(); };
  document.getElementById('themeBtn').onclick = function () {
    var light = !html.classList.contains('light');
    html.classList.add('theme-anim'); html.classList.toggle('light', light); html.classList.toggle('dark', !light); html.style.colorScheme = light ? 'light' : 'dark';
    document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#F6F8FC' : '#080A12');
    set('elyvori_theme', light ? 'light' : 'dark'); setTimeout(function () { html.classList.remove('theme-anim'); }, 450); chrome();
  };

  var q = new URLSearchParams(location.search);
  code = norm(q.get('code')) || norm(sget('elyvori_device_code'));
  if (code) sset('elyvori_device_code', code);
  if (location.hash.indexOf('elyvori_auth') >= 0) {
    var h = new URLSearchParams(location.hash.slice(1));
    if (h.get('elyvori_auth')) { set('elyvori_token', h.get('elyvori_auth')); set('elyvori_user', JSON.stringify({ email: h.get('email') || '', organizationName: h.get('org') || '' })); }
    history.replaceState(null, '', location.pathname + (code ? '?code=' + code : ''));
  }

  function askCode(msg) {
    view = function () { askCode(msg); };
    app.innerHTML = steps(1) + '<div class="center"><div class="badge-ico">' + I.link + '</div><h1 style="font-size:28px">' + esc(t().h1Ask) + '</h1><p class="lead" style="margin:0 auto 14px">' + esc(t().askLead) + '</p></div>' +
      '<form id="f" novalidate><label class="sr" for="c">Code</label><input class="inp codeinp" id="c" maxlength="9" placeholder="XXXX-XXXX" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" autofocus>' +
      '<button class="btn primary" type="submit" style="width:100%">' + esc(t().next) + '</button><div class="err" role="alert">' + esc(msg || '') + '</div></form>';
    document.getElementById('f').onsubmit = function (e) {
      e.preventDefault();
      var c = norm(document.getElementById('c').value);
      if (!c) { app.querySelector('.err').textContent = t().codeBad; return; }
      code = c; sset('elyvori_device_code', c); start();
    };
  }

  function login(msg) {
    view = function () { login(msg); };
    var back = location.origin + location.pathname;
    app.innerHTML = steps(2) + '<div class="center"><div class="badge-ico">' + I.lock + '</div><h1 style="font-size:26px">' + esc(t().h1Login) + '</h1><p class="lead" style="margin:0 auto">' + esc(msg || t().loginLead) + '</p></div>' + codeBox() +
      '<form id="lf" novalidate><label class="sr" for="em">' + esc(t().email) + '</label><input class="inp" id="em" type="email" inputmode="email" placeholder="' + esc(t().email) + '" autocomplete="username" required>' +
      '<label class="sr" for="pw">' + esc(t().password) + '</label><input class="inp" id="pw" type="password" placeholder="' + esc(t().password) + '" autocomplete="current-password" required>' +
      '<button class="btn primary" type="submit" id="lb" style="width:100%">' + esc(t().signBtn) + '</button><div class="err" id="ln" role="alert"></div></form>' +
      '<div class="or">' + esc(t().or) + '</div><div class="two">' +
      '<a class="btn" href="' + API + '/auth/google/start?redirect=' + encodeURIComponent(back) + '"><svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.4c-.2 1.3-1.6 3.8-5.4 3.8-3.2 0-5.9-2.7-5.9-6s2.7-6 5.9-6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.4 14.6 2.4 12 2.4 6.7 2.4 2.4 6.7 2.4 12s4.3 9.6 9.6 9.6c5.5 0 9.2-3.9 9.2-9.4 0-.6-.1-1.1-.2-1.6H12z"/></svg>Google</a>' +
      '<a class="btn" href="' + API + '/auth/github/start?redirect=' + encodeURIComponent(back) + '"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.6.3-1.1.6-1.3-2.2-.3-4.6-1.1-4.6-5a3.9 3.9 0 0 1 1-2.7c-.1-.3-.5-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1 .6 1.4.2 2.4.1 2.7a3.9 3.9 0 0 1 1 2.7c0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.8V21c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg>GitHub</a></div>';
    document.getElementById('lf').onsubmit = function (e) {
      e.preventDefault();
      var b = document.getElementById('lb'), n = document.getElementById('ln'); b.disabled = true; n.textContent = '';
      api('/auth/login', { method: 'POST', body: { email: document.getElementById('em').value, password: document.getElementById('pw').value } }).then(function (r) {
        if (r.s >= 200 && r.s < 300 && r.j.accessToken) { set('elyvori_token', r.j.accessToken); if (r.j.user) set('elyvori_user', JSON.stringify(r.j.user)); start(); }
        else { b.disabled = false; n.textContent = r.s === 401 ? t().badLogin : t().net; }
      }).catch(function () { b.disabled = false; n.textContent = t().net; });
    };
  }

  function confirmScreen(d) {
    data = d; view = function () { confirmScreen(d); };
    var tool = /vscode/i.test(d.client) ? 'VS Code' : d.client;
    app.innerHTML = steps(3) + '<h1 style="font-size:26px;text-align:center">' + esc(t().h1Confirm) + '</h1><p class="lead center" style="margin:0 auto">' + esc(t().confirmLead) + ' <b>' + esc(tool) + '</b>.</p>' + codeBox() +
      '<div class="dev"><div class="ic">' + I.vscode + '</div><div style="min-width:0"><b>' + esc(tool) + '</b><small>' + esc(d.name) + '</small></div></div>' +
      '<div class="actions2"><button class="btn" id="no" type="button">' + I.x + esc(t().deny) + '</button><button class="btn primary" id="yes" type="button">' + I.check + esc(t().approve) + '</button></div>' +
      '<div class="warn">' + I.warn + '<span>' + t().warn + '</span></div><div class="err" id="n" role="alert"></div>' +
      '<div class="who">' + esc(t().signedAs) + ' <b class="ltr">' + esc(email() || '—') + '</b> · <button class="linkbtn" id="sw" type="button">' + esc(t().notMe) + '</button></div>';
    document.getElementById('yes').onclick = function () { decide(true); };
    document.getElementById('no').onclick = function () { decide(false); };
    document.getElementById('sw').onclick = function () { try { localStorage.removeItem('elyvori_token'); localStorage.removeItem('elyvori_user'); } catch (e) {} login(); };
  }

  function decide(yes) {
    app.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    api('/devices/approve', { method: 'POST', auth: true, body: { code: code, approve: yes } }).then(function (r) {
      if (r.s === 401) return login(t().expired);
      if (r.s >= 300) return askCode(t().usedCode);
      sset('elyvori_device_code', null);
      done(yes);
    }).catch(function () { app.querySelectorAll('button').forEach(function (b) { b.disabled = false; }); document.getElementById('n').textContent = t().net; });
  }

  function done(yes) {
    view = function () { done(yes); };
    app.innerHTML = '<div class="center"><div class="badge-ico ' + (yes ? 'ok' : 'no') + '">' + (yes ? I.check : I.x) + '</div><h1 style="font-size:28px">' + esc(yes ? t().h1Done : t().h1Denied) + '</h1>' +
      '<p class="lead" style="margin:0 auto 20px">' + esc(yes ? t().doneLead : t().deniedLead) + '</p>' +
      (yes ? '<div class="two"><a class="btn" href="/account.html">' + esc(t().account) + '</a><a class="btn primary" href="/projects.html">' + esc(t().projects) + '</a></div>' : '') + '</div>';
  }

  function start() {
    if (!code) return askCode();
    if (!token()) return login();
    view = function () { app.innerHTML = '<div class="center">' + steps(3) + '<p class="lead" style="margin:0 auto">' + esc(t().checking) + '</p></div><div class="sk" style="height:76px;margin:18px 0"></div><div class="sk" style="height:74px"></div>'; };
    view();
    api('/devices/lookup?code=' + encodeURIComponent(code), { auth: true }).then(function (r) {
      if (r.s === 401) return login();
      if (r.s === 404) return askCode(t().expiredCode);
      if (r.s >= 300) return askCode(r.j && r.j.message === 'already_used' ? t().usedCode : t().wrongCode);
      confirmScreen(r.j);
    }).catch(function () { askCode(t().net); });
  }

  chrome();
  start();
})();
</script>
<script src="/ely-track.js" defer></script>
</body>
</html>
