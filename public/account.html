<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>حسابي | Elyvori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem('elyvori_theme');var d=t?t==='dark':!matchMedia('(prefers-color-scheme: light)').matches;document.documentElement.classList.add(d?'dark':'light');}catch(e){document.documentElement.classList.add('dark');}})();</script>
<style>
:root{--bg:#070a14;--card:#0e1324;--card2:#121a30;--line:#1f2740;--text:#e8ecf7;--muted:#9aa5c0;--accent:#7c5cff;--accent2:#22d3ee;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}
html.light{--bg:#f6f7fb;--card:#fff;--card2:#f3f5fa;--line:#e3e7f0;--text:#141a2b;--muted:#5a6580;--accent:#5b3df5;--accent2:#0891b2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden}
body{font-family:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
a{color:inherit}
.ltr{direction:ltr;unicode-bidi:isolate}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:17px}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff}
.btn{font:inherit;font-size:14px;font-weight:700;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff}
main{max-width:1100px;margin:0 auto;padding:18px 16px 70px}
h1{font-size:clamp(22px,4vw,30px);margin:4px 0 2px;font-weight:900}
h2{font-size:18px;margin:26px 0 10px;font-weight:800}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;min-width:0}
.planname{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:22px}
.pill{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap;display:inline-block}
.p-ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.p-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.p-info{background:color-mix(in srgb,var(--accent2) 18%,transparent);color:var(--accent2)}
.big{font-size:44px;font-weight:900;line-height:1.1}
.meter{height:10px;border-radius:999px;background:var(--card2);overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.muted{color:var(--muted);font-size:13px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.plan{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px;position:relative}
.plan.current{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2) inset}
.plan .price{font-size:32px;font-weight:900}
.plan ul{margin:4px 0 8px;padding-inline-start:18px;color:var(--muted);font-size:14px}
.plan .btn{margin-top:auto}
.tag{position:absolute;top:-11px;inset-inline-start:16px}
.costs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.cost{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;gap:10px}
.cost b{white-space:nowrap}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:0}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:800}
.row .main small{color:var(--muted);font-size:12.5px}
.amt{font-weight:800;white-space:nowrap}
.amt.plus{color:var(--ok)}
.wallets{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.msg{text-align:center;color:var(--muted);padding:36px 10px;background:var(--card);border:1px dashed var(--line);border-radius:18px}
@media (max-width:820px){.hero{grid-template-columns:1fr}.plans{grid-template-columns:1fr}}
@media (max-width:640px){.brand .t{display:none}.big{font-size:38px}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="/"><span class="logo">E</span><span class="t">Elyvori</span></a>
  <div style="display:flex;gap:8px">
    <button class="btn" id="refresh" type="button">↻ تحديث</button>
    <a class="btn" href="/">الرئيسية</a>
  </div>
</div></header>
<main>
  <h1>حسابي وباقتي</h1>
  <p class="sub">باقتك، رصيدك، قديش بتصرف كل خدمة، ومحفظتك — بمكان واحد.</p>
  <div id="app"><div class="msg">جاري التحميل… (أول مرة ممكن تاخد دقيقة)</div></div>
</main>
<script>
(function () {
  var API = 'https://elyvori-api.onrender.com';
  var app = document.getElementById('app');
  var SYM = { ILS: '₪', USD: '$', JOD: 'JD' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function token() { try { return localStorage.getItem('elyvori_token'); } catch (e) { return null; } }
  function day(iso) { try { return new Date(iso).toLocaleDateString('ar', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return ''; } }
  function when(iso) { try { return new Date(iso).toLocaleString('ar', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
  function num(n) { return Number(n || 0).toLocaleString('en-US'); }

  function render(s) {
    var planName = { free: 'المجانية', starter: 'Starter', pro: 'Pro' }[s.plan] || s.plan;
    var planObj = (s.plans || []).find(function (p) { return p.id === s.plan; }) || { credits: 200 };
    var siteCost = ((s.costs || []).find(function (c) { return c.action === 'build_code'; }) || { credits: 50 }).credits;
    var pct = Math.max(3, Math.min(100, Math.round((s.credits / Math.max(planObj.credits, s.credits, 1)) * 100)));
    var h = '<div class="hero">';
    h += '<div class="card"><div class="muted">باقتك الحالية</div>' +
      '<div class="planname">' + esc(planName) + ' ' + (s.plan === 'free' ? '<span class="pill p-info">مجانية</span>' : '<span class="pill p-ok">مفعّلة</span>') + '</div>' +
      (s.activeUntil ? '<div class="muted">لحد ' + esc(day(s.activeUntil)) + '</div>' : '') +
      (s.expired ? '<div style="margin-top:6px"><span class="pill p-warn">اشتراكك انتهى — جدّده عشان ينضافلك رصيد</span></div>' : '') +
      '<div style="margin-top:14px" class="muted">رصيدك</div>' +
      '<div class="big"><span class="ltr">' + num(s.credits) + '</span> <span style="font-size:18px;color:var(--muted)">رصيد</span></div>' +
      '<div class="meter"><i style="width:' + pct + '%"></i></div>' +
      '<div class="muted">≈ ' + Math.floor(s.credits / siteCost) + ' موقع' + (s.freeSites && s.freeSites.left > 0 ? ' · ومعك ' + s.freeSites.left + ' مواقع مجانية' : '') + '</div></div>';

    var w = s.wallet || {};
    h += '<div class="card"><div class="muted">محفظة Elyvori Pay</div>';
    if (w.linked) {
      h += '<div class="planname" style="font-size:18px">' + esc(w.name) + '</div><div class="muted ltr" style="text-align:right">' + esc(w.phone) + '</div><div class="wallets">' +
        (w.wallets || []).map(function (x) { return '<span class="pill p-info ltr">' + esc(x.balance) + ' ' + esc(SYM[x.currency] || x.currency) + '</span>'; }).join('') +
        '</div><a class="btn" href="/pay.html" target="_blank" rel="noopener">افتح المحفظة</a>';
    } else {
      h += '<p class="muted" style="margin:8px 0 14px">ادفع باقاتك من محفظة Elyvori Pay — وبتتفعّل فوراً.</p>' +
        '<a class="btn primary" href="/?checkout=starter">أنشئ أو اربط محفظتك</a>';
    }
    h += '</div></div>';

    h += '<h2>الباقات</h2><div class="plans">' + (s.plans || []).map(function (p) {
      var cur = p.id === s.plan;
      var feats = p.id === 'free'
        ? ['<b>' + p.credits + '</b> رصيد للبداية', p.freeSites + ' مواقع مجانية', 'كل الوكلاء الذكيين']
        : ['<b>' + num(p.credits) + '</b> رصيد كل شهر', '≈ ' + Math.floor(p.credits / siteCost) + ' موقع', 'الرصيد اللي ما بتستخدمه بيضل معك', 'كل الوكلاء الذكيين'];
      var btn = p.id === 'free' ? '<span class="btn" style="opacity:.6;cursor:default">' + (cur ? 'باقتك الحالية' : 'مجانية') + '</span>'
        : '<a class="btn' + (p.id === 'pro' ? ' primary' : '') + '" href="/?checkout=' + p.id + '">' + (cur ? 'جدّد' : 'رقّي لـ ' + esc(p.name_ar)) + ' — $' + p.priceUsd + '</a>';
      return '<div class="plan' + (cur ? ' current' : '') + '">' + (cur ? '<span class="pill p-ok tag">باقتك</span>' : p.id === 'pro' ? '<span class="pill p-info tag">الأفضل قيمة</span>' : '') +
        '<b style="font-size:18px">' + esc(p.name_ar) + '</b><div class="price"><span class="ltr">$' + p.priceUsd + '</span>' + (p.monthly ? ' <span class="muted">/ شهر</span>' : '') + '</div>' +
        '<ul>' + feats.map(function (f) { return '<li>' + f + '</li>'; }).join('') + '</ul>' + btn + '</div>';
    }).join('') + '</div>';

    h += '<h2>قديش بتصرف كل خدمة</h2><div class="costs">' + (s.costs || []).map(function (c) {
      return '<div class="cost"><span>' + esc(c.name_ar) + '</span><b><span class="ltr">' + c.credits + '</span> رصيد</b></div>';
    }).join('') + '</div>';

    h += '<h2>آخر الاستخدام</h2><div class="list">' + ((s.usage || []).map(function (u) {
      return '<div class="row"><div class="main"><b>' + esc(u.name_ar) + '</b><small>' + esc(when(u.createdAt)) + ' · الرصيد بعدها ' + num(u.balanceAfter) + '</small></div>' +
        '<span class="amt' + (u.amount > 0 ? ' plus' : '') + ' ltr">' + (u.amount > 0 ? '+' : '') + u.amount + '</span></div>';
    }).join('') || '<div class="msg" style="padding:20px">ما استخدمت إشي لسا — اطلب من المساعد يبنيلك موقع!</div>') + '</div>';
    app.innerHTML = h;
  }

  function load() {
    if (!token()) { app.innerHTML = '<div class="msg">سجّل دخول أول عشان تشوف حسابك.<br><br><a class="btn primary" href="/">تسجيل الدخول</a></div>'; return; }
    fetch(API + '/account/summary', { headers: { Authorization: 'Bearer ' + token() } })
      .then(function (r) { if (r.status === 401 || r.status === 403) throw new Error('auth'); if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function (s) {
        if (!s.found) { app.innerHTML = '<div class="msg">ما لقينا حسابك — سجّل دخول من جديد.<br><br><a class="btn primary" href="/">تسجيل الدخول</a></div>'; return; }
        render(s);
      })
      .catch(function (e) {
        app.innerHTML = e.message === 'auth'
          ? '<div class="msg">انتهت جلستك — سجّل دخول مرة ثانية.<br><br><a class="btn primary" href="/">تسجيل الدخول</a></div>'
          : '<div class="msg">ما قدرت أحمّل حسابك (السيرفر ممكن يكون نايم).<br><br><button class="btn" type="button" id="retry">↻ حاول مرة ثانية</button></div>';
        var b = document.getElementById('retry'); if (b) b.onclick = load;
      });
  }
  document.getElementById('refresh').onclick = load;
  load();
})();
</script>
</body>
</html>
