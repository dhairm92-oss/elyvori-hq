<!doctype html>
<html lang="en" dir="ltr" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080A12">
<title>My projects | Elyvori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* same keys as the main site: elyvori_theme (dark default) and elyvori_lang (en default) */
(function () {
  var d = document.documentElement, t = 'dark', l = 'en';
  try { t = localStorage.getItem('elyvori_theme') === 'light' ? 'light' : 'dark'; l = localStorage.getItem('elyvori_lang') === 'ar' ? 'ar' : 'en'; } catch (e) {}
  d.className = t; d.lang = l; d.dir = l === 'ar' ? 'rtl' : 'ltr'; d.style.colorScheme = t;
})();
</script>
<style>
:root{
  --bg:#080A12;--bg2:#0B0F1C;--card:rgba(17,23,40,.72);--card-solid:#111728;--line:rgba(148,163,184,.14);--line2:rgba(148,163,184,.24);
  --text:#EEF2F8;--body:#DCE3EE;--muted:#9AA6BC;--faint:#6B778C;
  --cyan:#00E5FF;--violet:#7C3AED;--ok:#22C55E;--warn:#F59E0B;--bad:#F43F5E;
  --grad:linear-gradient(135deg,#00E5FF 0%,#7C3AED 100%);
  --glow:0 0 0 1px rgba(0,229,255,.25),0 10px 40px -12px rgba(0,229,255,.35);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 50px -30px rgba(0,0,0,.9);
  --r:20px;--safe-b:env(safe-area-inset-bottom,0px);
}
html.light{
  --bg:#F6F8FC;--bg2:#EEF2F9;--card:rgba(255,255,255,.86);--card-solid:#FFFFFF;--line:rgba(15,23,42,.08);--line2:rgba(15,23,42,.14);
  --text:#0F172A;--body:#1E293B;--muted:#5B6578;--faint:#8A94A6;
  --glow:0 0 0 1px rgba(124,58,237,.25),0 12px 34px -14px rgba(124,58,237,.35);
  --shadow:0 1px 2px rgba(15,23,42,.05),0 12px 30px -18px rgba(15,23,42,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);overflow-x:clip}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh;min-height:100dvh}
[dir=rtl] body{font-family:'Cairo','Plus Jakarta Sans',system-ui,sans-serif}
.theme-anim *,.theme-anim{transition:background-color .35s,border-color .35s,color .35s!important}
button,input{font:inherit}
a{color:inherit}
.ltr{direction:ltr;unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 500px at 85% -10%,rgba(124,58,237,.18),transparent 60%),radial-gradient(700px 420px at 0% 0%,rgba(0,229,255,.12),transparent 60%),var(--bg)}
html.light .bgfx{background:radial-gradient(900px 500px at 85% -10%,rgba(124,58,237,.10),transparent 60%),radial-gradient(700px 420px at 0% 0%,rgba(0,229,255,.10),transparent 60%),var(--bg)}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:18px;letter-spacing:-.01em}
.mark{position:relative;width:38px;height:38px;flex:none}
.mark:before{content:'';position:absolute;inset:-2px;border-radius:13px;background:conic-gradient(from 0deg,#06b6d4,#8b5cf6,#ec4899,#10b981,#06b6d4);animation:spin 4s linear infinite;opacity:.9}
.mark i{position:absolute;inset:1px;border-radius:11px;background:#0B1020;display:grid;place-items:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.mark:before{animation:none}.sk{animation:none!important}}
.grow{flex:1}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;height:40px;padding:0 10px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--text);cursor:pointer;font-weight:800;font-size:13px;text-decoration:none}
.icon-btn:hover{border-color:var(--cyan)}
.icon-btn svg{width:18px;height:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .15s,box-shadow .2s,border-color .2s}
.btn:hover{border-color:var(--cyan)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:default}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 10px 30px -12px rgba(0,229,255,.6)}
.btn.primary:hover{box-shadow:0 14px 36px -10px rgba(124,58,237,.7)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:11px}
.btn svg{width:18px;height:18px;flex:none}
main{max-width:1180px;margin:0 auto;padding:26px 20px calc(80px + var(--safe-b))}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
html.light .eyebrow{color:#0891B2}
[dir=rtl] .eyebrow{letter-spacing:0}
.eyebrow:before{content:'';width:18px;height:2px;border-radius:2px;background:var(--grad)}
h1{font-size:clamp(26px,4.4vw,40px);line-height:1.15;margin:0 0 8px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
[dir=rtl] h1{letter-spacing:0;line-height:1.35}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:19px;margin:34px 0 14px;font-weight:800;display:flex;align-items:center;gap:10px}
h2 .count{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.lead{color:var(--muted);margin:0;max-width:640px;font-size:15px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{padding:16px 18px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .v{font-size:26px;font-weight:800;line-height:1.2;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
a.pcard{display:flex;flex-direction:column;gap:12px;padding:20px;text-decoration:none;position:relative;overflow:hidden;transition:transform .2s,box-shadow .25s,border-color .25s}
a.pcard:before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad);opacity:0;transition:opacity .25s}
a.pcard:hover{transform:translateY(-3px);box-shadow:var(--glow);border-color:transparent}
a.pcard:hover:before{opacity:1}
a.pcard:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.prow{display:flex;align-items:flex-start;gap:12px}
.pav{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;background:var(--grad)}
.ptitle{min-width:0;flex:1}
.pname{font-weight:800;font-size:17px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.pdev{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:6px;margin-top:2px}
.pdev svg{width:14px;height:14px}
.psum{color:var(--muted);font-size:13.5px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.chip:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border-color:color-mix(in srgb,var(--ok) 28%,transparent)}
html.light .c-ok{color:#15803D}
.c-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
html.light .c-warn{color:#B45309}
.c-info{color:var(--cyan);background:color-mix(in srgb,var(--cyan) 10%,transparent);border-color:color-mix(in srgb,var(--cyan) 28%,transparent)}
html.light .c-info{color:#0891B2}
.c-off{color:var(--muted);background:var(--bg2);border-color:var(--line)}
.c-off:before{background:var(--faint)}
.bar{height:8px;border-radius:999px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:999px;background:var(--grad)}
.prog{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.prog b{color:var(--text)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.metric .k{font-size:11.5px;color:var(--muted)}
.metric .v{font-weight:800;font-size:15px;line-height:1.35}
.upd{font-size:12px;color:var(--faint)}
.empty{padding:38px 24px;text-align:center}
.empty .ill{width:84px;height:84px;margin:0 auto 10px;border-radius:24px;display:grid;place-items:center;background:var(--grad);box-shadow:0 18px 40px -14px rgba(124,58,237,.6);color:#fff}
.empty .ill svg{width:40px;height:40px}
.steps{display:grid;gap:10px;max-width:560px;margin:18px auto 22px;text-align:start}
.step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.step .n{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--grad);color:#fff;flex:none}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:600;margin-bottom:14px;min-height:36px}
.back:hover{color:var(--text)}
.back svg{width:18px;height:18px}
[dir=rtl] .flip{transform:scaleX(-1)}
.dhead{padding:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.dmeta{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:13px;margin-top:8px}
.dmeta span{display:inline-flex;align-items:center;gap:6px}
.dmeta svg{width:15px;height:15px}
.dactions{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:230px}
.ring{--p:0;width:88px;height:88px;border-radius:50%;background:conic-gradient(var(--cyan),var(--violet) calc(var(--p)*1%),var(--bg2) 0);display:grid;place-items:center;flex:none}
.ring i{width:70px;height:70px;border-radius:50%;background:var(--card-solid);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:18px}
.drow{display:flex;gap:18px;align-items:center;min-width:0}
.hint{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.hint svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--cyan)}
.note-card{padding:12px 14px;margin-top:12px}
.tasks{display:grid;gap:10px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 16px}
.tid{font-family:ui-monospace,'SF Mono',Consolas,monospace;font-size:12px;color:var(--muted);direction:ltr;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.ttl{font-weight:700;min-width:0;line-height:1.45;overflow-wrap:anywhere}
.ttl small{display:block;color:var(--faint);font-weight:500;font-size:12.5px;margin-top:2px}
.tend{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.screens{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.scr{padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.scr .sh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.scr .sh b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.route{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--cyan);direction:ltr;unicode-bidi:isolate}
html.light .route{color:#0891B2}
.wf{background:var(--wbg);border-radius:18px;overflow:hidden;border:5px solid #1E293B;display:flex;flex-direction:column;gap:6px;padding-bottom:10px;min-height:240px;box-shadow:0 14px 30px -18px rgba(0,0,0,.6)}
.wf.web{border-width:1px;border-color:var(--line2);border-radius:12px}
.wf .url{display:flex;gap:4px;align-items:center;padding:6px 8px;background:#0f172a;direction:ltr}
.wf .url i{width:6px;height:6px;border-radius:50%;background:#334155}
.wf .hd{background:var(--wp);color:#fff;padding:10px 12px;font-weight:800;font-size:13px}
.wf .c{margin:0 8px;border-radius:9px;background:var(--wsf);padding:7px 9px;font-size:11px;color:var(--wtx);border:1px dashed rgba(100,116,139,.45)}
.wf .c.b{background:var(--wp);color:#fff;text-align:center;font-weight:800;border:0;border-radius:999px}
.wf .c.i{background:var(--wbg);border:1px solid rgba(100,116,139,.6)}
.wf .c.m{height:54px;display:grid;place-items:center;background:repeating-linear-gradient(45deg,var(--wsf),var(--wsf) 6px,transparent 6px,transparent 12px)}
.wf .c.n{display:flex;justify-content:space-around;border-style:solid}
.wf .c.n i{width:14px;height:14px;border-radius:5px;background:var(--wp);opacity:.6}
.purpose{font-size:12.5px;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
[dir=rtl] .sw{padding:8px 8px 8px 12px}
.sw i{width:30px;height:30px;border-radius:9px;border:1px solid var(--line2)}
.sw b{display:block;font-size:13px}
.sw small{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.auth{max-width:440px;margin:30px auto;padding:26px}
.inp{width:100%;min-height:48px;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);margin:6px 0 10px;direction:ltr;font-size:16px}
.inp:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.15)}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12.5px;margin:16px 0}
.or:before,.or:after{content:'';flex:1;height:1px;background:var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}
.sk{background:linear-gradient(90deg,var(--bg2) 25%,var(--line2) 50%,var(--bg2) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}
.mbar{display:none}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + var(--safe-b));z-index:40;max-width:520px;margin:0 auto;padding:12px 16px;border-radius:14px;background:var(--card-solid);border:1px solid var(--line2);box-shadow:var(--shadow);font-size:13.5px;display:none}
.toast.show{display:block}
/* ---- guide badge (first visits) */
.guide-wrap{position:relative;display:inline-flex;flex-direction:column;align-items:flex-end;gap:12px}
.guide{position:relative;display:flex;align-items:center;gap:10px;max-width:300px;padding:10px 12px 10px 14px;border-radius:14px;background:var(--card-solid);border:1px solid color-mix(in srgb,var(--cyan) 45%,transparent);color:var(--text);font-size:13px;font-weight:700;line-height:1.45;box-shadow:0 0 0 0 rgba(0,229,255,.45),0 14px 34px -14px rgba(0,229,255,.55);animation:gpulse 2.4s ease-out infinite,gfloat 3.2s ease-in-out infinite}
[dir=rtl] .guide{padding:10px 14px 10px 12px}
html.light .guide{border-color:color-mix(in srgb,var(--violet) 40%,transparent);box-shadow:0 0 0 0 rgba(124,58,237,.35),0 12px 28px -14px rgba(124,58,237,.45)}
.guide:before{content:'';position:absolute;top:-7px;inset-inline-end:28px;width:12px;height:12px;background:var(--card-solid);border-top:1px solid color-mix(in srgb,var(--cyan) 45%,transparent);border-inline-start:1px solid color-mix(in srgb,var(--cyan) 45%,transparent);transform:rotate(45deg)}
[dir=rtl] .guide:before{transform:rotate(-45deg)}
html.light .guide:before{border-color:color-mix(in srgb,var(--violet) 40%,transparent)}
.guide .gi{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:var(--grad);color:#fff;flex:none}
.guide .gi svg{width:15px;height:15px}
.guide .gx{margin-inline-start:2px;width:26px;height:26px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;flex:none}
.guide .gx:hover{background:var(--bg2);color:var(--text)}
.guide .gx svg{width:14px;height:14px}
@keyframes gpulse{0%{box-shadow:0 0 0 0 rgba(0,229,255,.45),0 14px 34px -14px rgba(0,229,255,.55)}70%{box-shadow:0 0 0 12px rgba(0,229,255,0),0 14px 34px -14px rgba(0,229,255,.55)}100%{box-shadow:0 0 0 0 rgba(0,229,255,0),0 14px 34px -14px rgba(0,229,255,.55)}}
@keyframes gfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.btn.glow{animation:bglow 2.4s ease-out infinite}
@keyframes bglow{0%{box-shadow:0 0 0 0 rgba(0,229,255,.55),0 10px 30px -12px rgba(0,229,255,.6)}70%{box-shadow:0 0 0 10px rgba(0,229,255,0),0 10px 30px -12px rgba(0,229,255,.6)}100%{box-shadow:0 0 0 0 rgba(0,229,255,0),0 10px 30px -12px rgba(0,229,255,.6)}}
@media (prefers-reduced-motion:reduce){.guide,.btn.glow,.live i,.busy-bar i{animation:none!important}}
.alt-link{background:none;border:0;padding:4px 2px;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:4px}
.alt-link:hover{color:var(--text);text-decoration-color:var(--cyan)}
.alt-link svg{width:16px;height:16px}

/* ---- sheet (dialog on desktop, bottom sheet on phones) */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(3,6,14,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .2s}
html.light .sheet-bg{background:rgba(15,23,42,.35)}
.sheet-bg.show{opacity:1}
.sheet{width:100%;max-width:560px;max-height:min(88vh,860px);overflow:auto;overscroll-behavior:contain;background:var(--card-solid);border:1px solid var(--line2);border-radius:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7),0 0 0 1px rgba(0,229,255,.08);padding:22px;transform:translateY(12px) scale(.98);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet-bg.show .sheet{transform:none}
.sheet .grab{display:none}
.sh-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.sh-head h3{margin:0;font-size:20px;font-weight:800;line-height:1.3;flex:1}
.sh-x{width:38px;height:38px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);cursor:pointer;display:grid;place-items:center;flex:none}
.sh-x svg{width:18px;height:18px}
.sh-lead{color:var(--muted);font-size:14px;margin:0 0 16px}
.how{display:flex;align-items:center;gap:8px;padding:12px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);margin-bottom:16px;font-size:12.5px;color:var(--muted);text-align:center}
.how div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.how b{color:var(--text);font-size:12.5px}
.how .hi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card-solid);border:1px solid var(--line2)}

.opt .oi svg{width:22px;height:22px}
.opt.rec .oi{background:var(--grad);border:0;color:#fff}
.opt .ot{flex:1;min-width:0}
.opt .ot b{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.opt .ot small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.45}
.opt .badge{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--grad);color:#fff;letter-spacing:.02em}
.opt .chev{color:var(--faint);flex:none}

.field{display:block;font-size:13px;font-weight:700;margin:4px 0 6px}

.ta.sm{min-height:76px}
.examples{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.examples button{border:1px dashed var(--line2);background:transparent;color:var(--muted);font:inherit;font-size:12.5px;padding:5px 10px;border-radius:999px;cursor:pointer}
.examples button:hover{color:var(--text);border-color:var(--cyan)}
.pcs{display:grid;gap:8px;margin-bottom:14px}

.share-row .btn svg{width:22px;height:22px}

.tstep.done:not(:last-child):after{background:var(--grad)}

.tstep b{display:block;font-size:14px;line-height:1.5}
.tstep small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}

.crit li{display:flex;gap:8px;font-size:13px;color:var(--body)}

.req b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.req small{display:block;color:var(--muted);font-size:12px;line-height:1.45}

.figrow small{display:block;color:var(--muted);font-size:12.5px}

      if (draw(b, r)) return;
      sheetTimer = setInterval(function () {
        get('/devices/requests?project=*new').then(function (list) {
          var x = list.filter(function (q) { return q.id === r.id; })[0];
          if (x && sheetEl) { r = x; if (draw(b, r)) { clearInterval(sheetTimer); if (r.status === 'done') pcs = null; } }
        }).catch(function () {});
      }, 4000);
    });
  }

  // Phones (and "away" links) get the sheet instead of a vscode:// link that cannot open there
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="vscode://"]');
    if (!a) return;
    if (!mobile) { toast(t().opening); return; }
    e.preventDefault();
    var href = a.getAttribute('href'), q = href.split('?')[1] || '', p = new URLSearchParams(q);
    actionSheet(href.indexOf('/new') >= 0 ? {} : { key: p.get('project'), task: p.get('task'), repo: current && current.repo, deep: href });
  });
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('[data-away]');
    if (a) { e.preventDefault(); actionSheet(current ? { key: current.key, repo: current.repo, deep: deep(current.key) } : {}); }
  });

  // ---------------------------------------------------------------- remote panel on the project page
  var current = null, poll = null;
  function remotePanel(p, reqs, list) {
    var dev = list.filter(function (d) { return d.id === p.deviceId; })[0];
    var h = '<section class="card remote" id="remote" aria-live="polite"><div class="rhead"><h2>' + I.remote + '<span>' + esc(t().remoteH) + '</span></h2>' +
      '<span class="upd">' + esc(t().pcLine) + ' <b dir="auto">' + esc(p.device) + '</b></span> ' + liveDot(!!(dev && dev.online)) + '</div>';
    if (p.busy) h += '<div class="busy-bar"><i></i></div><p class="upd" style="margin:-4px 0 12px">' + esc(p.busy === 'plan' ? t().busyPlan : p.busy === 'build' ? t().busyBuild : t().busyOther) + '</p>';
    var waiting = function (kind, extra) { return reqs.some(function (r) { return r.kind === kind && (r.status === 'queued' || r.status === 'working') && (!extra || extra(r)); }); };
    if (dev && !dev.online) h += '<div class="warnbox">' + I.warn + '<span>' + esc(t().offWarn) + '</span></div>';
    if (p.figma && p.figma.linked) {
      var fw = waiting('figmaSync');
      h += '<div class="figrow' + (p.figma.changed ? ' changed' : '') + '"><span class="fgi">' + I.figma + '</span><div style="min-width:0;flex:1"><b dir="auto">' + esc(p.figma.fileName) + '</b><small>' + esc(p.figma.changed ? t().figmaChanged : p.figma.lastSync ? t().figmaFresh + ' · ' + t().synced + ' ' + ago(p.figma.lastSync) : t().figmaNever) + '</small></div>' +
        (p.figma.changed || !p.figma.lastSync ? '<button class="btn sm primary" type="button" data-req="figmaSync"' + (fw || p.busy || p.pending || p.draft ? ' disabled' : '') + '>' + esc(t().figmaSync) + '</button>' : '<button class="btn sm" type="button" data-req="figmaSync"' + (fw || p.busy || p.pending || p.draft ? ' disabled' : '') + '>' + I.refresh + '</button>') + '</div>';
    }

    if (p.draft && p.draft.tasks) {
      h += '<div class="wait"><h3>' + I.sparkle.replace('<svg', '<svg width="18" height="18"') + esc(t().planWait) + '</h3><p>' + esc(t().planWaitS) + '</p>' +
        '<div class="tasks" style="margin-bottom:12px">' + p.draft.tasks.map(function (x) { return '<div class="card task" style="padding:10px 12px"><span class="tid">' + esc(x.id) + '</span><div class="ttl" dir="auto">' + esc(x.title) + '</div></div>'; }).join('') + '</div>' +
        '<div class="btn-row"><button class="btn ok" type="button" data-req="approvePlan"' + (waiting('approvePlan') ? ' disabled' : '') + '>' + I.check + esc(t().approvePlan) + '</button><button class="btn danger" type="button" data-req="discardPlan"' + (waiting('discardPlan') ? ' disabled' : '') + '>' + esc(t().discardPlan) + '</button></div></div>';
    } else if (p.pending) {
      var pd = p.pending, busyA = waiting('approve', function (r) { return r.taskId === pd.taskId; }) || waiting('reject', function (r) { return r.taskId === pd.taskId; });
      h += '<div class="wait"><h3><span class="tid">' + esc(pd.taskId) + '</span><span dir="auto">' + esc(pd.title) + '</span></h3><p>' + esc(t().taskWait) + ' · ' + num(pd.files.length) + ' ' + esc(t().filesN) + ' · ' + esc(t().attempt) + ' ' + num(pd.attempts) + '<br>' + esc(t().taskWaitS) + '</p>' +
        '<div class="files">' + pd.files.slice(0, 14).map(function (f) { return '<span title="' + esc(f) + '">' + esc(f) + '</span>'; }).join('') + (pd.files.length > 14 ? '<span>+' + (pd.files.length - 14) + '</span>' : '') + '</div>' +
        (pd.criteria.length ? '<ul class="crit">' + pd.criteria.map(function (c) { return '<li>' + I.checkc + '<span dir="auto">' + esc(c) + '</span></li>'; }).join('') + '</ul>' : '') +
        '<div class="btn-row"><button class="btn ok" type="button" id="apv" data-tip-target="approve"' + (busyA ? ' disabled' : '') + '>' + I.check + esc(t().approve) + '</button><button class="btn danger" type="button" id="rjt"' + (busyA ? ' disabled' : '') + '>' + esc(t().reject) + '</button></div>' + guide('approve') +
        '<div class="rnote" id="rnote"><label class="field" for="rtext">' + esc(t().rejectNote) + '</label><textarea class="ta sm" id="rtext" dir="auto" maxlength="4000"></textarea><div class="btn-row" style="margin-top:8px"><button class="btn primary" type="button" id="rsend">' + esc(t().rejectSend) + '</button><button class="btn" type="button" id="ronly">' + esc(t().rejectOnly) + '</button></div></div></div>';
    } else if (p.tasks.some(function (x) { return x.state === 'next'; }) && !p.busy) {
      var wb = waiting('build') || waiting('buildAll');
      h += '<div class="btn-row" style="margin-bottom:6px"><button class="btn primary" type="button" data-req="build"' + (wb ? ' disabled' : '') + '>' + I.play + esc(t().buildNext) + '</button><button class="btn" type="button" data-req="buildAll"' + (wb ? ' disabled' : '') + '>' + esc(t().buildAll) + '</button></div>';
    } else if (p.tasks.length && p.tasks.every(function (x) { return x.state === 'done'; })) {
      h += '<p class="upd" style="margin:0 0 6px;display:flex;gap:6px;align-items:center;color:var(--ok)">' + I.checkc.replace('<svg', '<svg width="16" height="16"') + esc(t().allDone) + '</p>';
    }
    if (!p.draft && !p.pending) {
      h += '<div class="sub">' + esc(t().feature) + '</div><textarea class="ta sm" id="feat" dir="auto" maxlength="4000" placeholder="' + esc(t().featurePh) + '"></textarea>' +
        '<div class="btn-row" style="margin-top:8px"><button class="btn" type="button" id="featSend"' + (p.busy || waiting('extend') ? ' disabled' : '') + '>' + I.send + esc(t().featureBtn) + '</button></div>';
    }
    if (reqs.length) {
      h += '<div class="sub">' + esc(t().recent) + '</div><div class="reqs">' + reqs.slice(0, 6).map(function (r) {
        var map = { queued: 'c-info', working: 'c-info', done: 'c-ok', failed: 'c-bad', expired: 'c-off', cancelled: 'c-off' };
        return '<div class="req"><span class="ri">' + (r.status === 'working' || r.status === 'queued' ? '<i class="spin"></i>' : I.phone) + '</span><div style="min-width:0"><b>' + esc(t().k[r.kind] || r.kind) + (r.taskId ? ' · <span class="ltr">' + esc(r.taskId) + '</span>' : '') + (r.text ? ' — <span dir="auto">' + esc(r.text) + '</span>' : '') + '</b>' +
          '<small dir="auto">' + esc(r.message || ago(r.updatedAt)) + '</small></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="chip ' + (map[r.status] || 'c-off') + '">' + esc(t().s[r.status] || r.status) + '</span>' +
          (r.status === 'queued' ? '<button class="rx" type="button" data-cancel="' + esc(r.id) + '">' + esc(t().cancel) + '</button>' : '') + '</div></div>';
      }).join('') + '</div>';
    }
    return h + '</section>';
  }

  function wireRemote(p) {
    var root = document.getElementById('remote'); if (!root) return;
    var go = function (body, btn) {
      if (btn) btn.disabled = true;
      return send('POST', '/devices/requests', Object.assign({ projectKey: p.key }, body)).then(function () { toast(t().sentOk); refreshRemote(p.key, true); })
        .catch(function (e) { if (btn) btn.disabled = false; if (e.message === 'auth') return login(t().expired); toast(e.message === 'no_device' ? t().noDevice : t().sendErr); });
    };
    root.querySelectorAll('[data-req]').forEach(function (b) { b.onclick = function () { go({ kind: b.getAttribute('data-req') }, b); }; });
    var apv = root.querySelector('#apv');
    if (apv) apv.onclick = function () {
      if (!apv.classList.contains('sure')) { apv.classList.add('sure'); apv.lastChild.textContent = t().sure; setTimeout(function () { if (document.body.contains(apv) && !apv.disabled) { apv.classList.remove('sure'); apv.lastChild.textContent = t().approve; } }, 4000); return; }
      go({ kind: 'approve', taskId: p.pending.taskId }, apv);
    };
    var rjt = root.querySelector('#rjt');
    if (rjt) rjt.onclick = function () { var n = root.querySelector('#rnote'); n.classList.toggle('show'); if (n.classList.contains('show')) root.querySelector('#rtext').focus(); };
    var rs = root.querySelector('#rsend'), ro = root.querySelector('#ronly');
    if (rs) rs.onclick = function () { var v = root.querySelector('#rtext').value.trim(); if (v.length < 3) { root.querySelector('#rtext').focus(); return; } go({ kind: 'reject', taskId: p.pending.taskId, text: v }, rs); };
    if (ro) ro.onclick = function () { go({ kind: 'reject', taskId: p.pending.taskId }, ro); };
    var fs = root.querySelector('#featSend');
    if (fs) fs.onclick = function () { var v = root.querySelector('#feat').value.trim(); if (v.length < 8) { toast(t().short); root.querySelector('#feat').focus(); return; } go({ kind: 'extend', text: v }, fs); };
    root.querySelectorAll('[data-cancel]').forEach(function (b) { b.onclick = function () { b.disabled = true; send('DELETE', '/devices/requests/' + encodeURIComponent(b.getAttribute('data-cancel'))).then(function () { refreshRemote(p.key, true); }).catch(function () { b.disabled = false; }); }; });
  }

  /** Re-renders the remote panel (and the page when the project changed) while something is on its way. */
  function refreshRemote(key, soon) {
    clearTimeout(poll);
    if (!current || current.key !== key) return;
    Promise.all([get('/devices/projects/' + encodeURIComponent(key)), get('/devices/requests?project=' + encodeURIComponent(key)), computers(true).catch(function () { return []; })]).then(function (r) {
      if (!current || current.key !== key) return;
      var p = r[0], reqs = r[1], list = r[2];
      var typing = document.activeElement && /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName) && document.getElementById('remote') && document.getElementById('remote').contains(document.activeElement);
      var changed = JSON.stringify([p.tasks, p.screens, p.revision]) !== JSON.stringify([current.tasks, current.screens, current.revision]);
      current = p;
      if (changed && !typing) { project(key, true); return; }
      var el = document.getElementById('remote');
      if (el && !typing) { el.outerHTML = remotePanel(p, reqs, list); wireRemote(p); }
      var active = p.busy || reqs.some(function (q) { return q.status === 'queued' || q.status === 'working'; });
      poll = setTimeout(function () { if (document.visibilityState === 'visible') refreshRemote(key); else refreshRemote(key); }, active ? 4000 : 20000);
    }).catch(function () { poll = setTimeout(function () { refreshRemote(key); }, 20000); });
  }

  function route() {
    clearTimeout(poll); current = null; closeSheet();
    chrome();
    if (location.hash.indexOf('elyvori_auth') >= 0) {
      var hp = new URLSearchParams(location.hash.slice(1));
      if (hp.get('elyvori_auth')) { store('elyvori_token', hp.get('elyvori_auth')); store('elyvori_user', JSON.stringify({ email: hp.get('email') || '', organizationName: hp.get('org') || '' })); }
      history.replaceState(null, '', location.pathname);
    }
    if (!token()) return login();
    var m = location.hash.match(/^#p=(.+)$/);
    if (m) project(decodeURIComponent(m[1])); else list();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
<script src="/ely-track.js" defer></script>
<script src="/ely-tour.js" defer></script>
</body>
