<!doctype html>
<html lang="en" dir="ltr" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080A12">
<title>Factory admin | Elyvori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* same keys as the main site: elyvori_theme (dark default) and elyvori_lang (en default) */
(function () {
  var d = document.documentElement, t = 'dark', l = 'en';
  try { t = localStorage.getItem('elyvori_theme') === 'light' ? 'light' : 'dark'; l = localStorage.getItem('elyvori_lang') === 'ar' ? 'ar' : 'en'; } catch (e) {}
  d.className = t; d.lang = l; d.dir = l === 'ar' ? 'rtl' : 'ltr'; d.style.colorScheme = t;
})();
</script>
<style>
:root{
  --bg:#080A12;--bg2:#0B0F1C;--card:rgba(17,23,40,.72);--card-solid:#111728;--line:rgba(148,163,184,.14);--line2:rgba(148,163,184,.24);
  --text:#EEF2F8;--body:#DCE3EE;--muted:#9AA6BC;--faint:#6B778C;
  --cyan:#00E5FF;--violet:#7C3AED;--ok:#22C55E;--warn:#F59E0B;--bad:#F43F5E;
  --grad:linear-gradient(135deg,#00E5FF 0%,#7C3AED 100%);
  --glow:0 0 0 1px rgba(0,229,255,.25),0 10px 40px -12px rgba(0,229,255,.35);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 50px -30px rgba(0,0,0,.9);
  --r:20px;--safe-b:env(safe-area-inset-bottom,0px);
}
html.light{
  --bg:#F6F8FC;--bg2:#EEF2F9;--card:rgba(255,255,255,.86);--card-solid:#FFFFFF;--line:rgba(15,23,42,.08);--line2:rgba(15,23,42,.14);
  --text:#0F172A;--body:#1E293B;--muted:#5B6578;--faint:#8A94A6;
  --glow:0 0 0 1px rgba(124,58,237,.25),0 12px 34px -14px rgba(124,58,237,.35);
  --shadow:0 1px 2px rgba(15,23,42,.05),0 12px 30px -18px rgba(15,23,42,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);overflow-x:clip}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh;min-height:100dvh}
[dir=rtl] body{font-family:'Cairo','Plus Jakarta Sans',system-ui,sans-serif}
.theme-anim *,.theme-anim{transition:background-color .35s,border-color .35s,color .35s!important}
button,input{font:inherit}
a{color:inherit}
.ltr{direction:ltr;unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 500px at 85% -10%,rgba(124,58,237,.18),transparent 60%),radial-gradient(700px 420px at 0% 0%,rgba(0,229,255,.12),transparent 60%),var(--bg)}
html.light .bgfx{background:radial-gradient(900px 500px at 85% -10%,rgba(124,58,237,.10),transparent 60%),radial-gradient(700px 420px at 0% 0%,rgba(0,229,255,.10),transparent 60%),var(--bg)}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:18px;letter-spacing:-.01em}
.mark{position:relative;width:38px;height:38px;flex:none}
.mark:before{content:'';position:absolute;inset:-2px;border-radius:13px;background:conic-gradient(from 0deg,#06b6d4,#8b5cf6,#ec4899,#10b981,#06b6d4);animation:spin 4s linear infinite;opacity:.9}
.mark i{position:absolute;inset:1px;border-radius:11px;background:#0B1020;display:grid;place-items:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.mark:before{animation:none}.sk{animation:none!important}}
.grow{flex:1}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;height:40px;padding:0 10px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--text);cursor:pointer;font-weight:800;font-size:13px;text-decoration:none}
.icon-btn:hover{border-color:var(--cyan)}
.icon-btn svg{width:18px;height:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .15s,box-shadow .2s,border-color .2s}
.btn:hover{border-color:var(--cyan)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:default}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 10px 30px -12px rgba(0,229,255,.6)}
.btn.primary:hover{box-shadow:0 14px 36px -10px rgba(124,58,237,.7)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:11px}
.btn svg{width:18px;height:18px;flex:none}
main{max-width:1180px;margin:0 auto;padding:26px 20px calc(80px + var(--safe-b))}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
html.light .eyebrow{color:#0891B2}
[dir=rtl] .eyebrow{letter-spacing:0}
.eyebrow:before{content:'';width:18px;height:2px;border-radius:2px;background:var(--grad)}
h1{font-size:clamp(26px,4.4vw,40px);line-height:1.15;margin:0 0 8px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
[dir=rtl] h1{letter-spacing:0;line-height:1.35}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:19px;margin:34px 0 14px;font-weight:800;display:flex;align-items:center;gap:10px}
h2 .count{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.lead{color:var(--muted);margin:0;max-width:640px;font-size:15px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{padding:16px 18px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .v{font-size:26px;font-weight:800;line-height:1.2;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
a.pcard{display:flex;flex-direction:column;gap:12px;padding:20px;text-decoration:none;position:relative;overflow:hidden;transition:transform .2s,box-shadow .25s,border-color .25s}
a.pcard:before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad);opacity:0;transition:opacity .25s}
a.pcard:hover{transform:translateY(-3px);box-shadow:var(--glow);border-color:transparent}
a.pcard:hover:before{opacity:1}
a.pcard:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.prow{display:flex;align-items:flex-start;gap:12px}
.pav{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;background:var(--grad)}
.ptitle{min-width:0;flex:1}
.pname{font-weight:800;font-size:17px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.pdev{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:6px;margin-top:2px}
.pdev svg{width:14px;height:14px}
.psum{color:var(--muted);font-size:13.5px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.chip:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border-color:color-mix(in srgb,var(--ok) 28%,transparent)}
html.light .c-ok{color:#15803D}
.c-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
html.light .c-warn{color:#B45309}
.c-info{color:var(--cyan);background:color-mix(in srgb,var(--cyan) 10%,transparent);border-color:color-mix(in srgb,var(--cyan) 28%,transparent)}
html.light .c-info{color:#0891B2}
.c-off{color:var(--muted);background:var(--bg2);border-color:var(--line)}
.c-off:before{background:var(--faint)}
.bar{height:8px;border-radius:999px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:999px;background:var(--grad)}
.prog{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.prog b{color:var(--text)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.metric .k{font-size:11.5px;color:var(--muted)}
.metric .v{font-weight:800;font-size:15px;line-height:1.35}
.upd{font-size:12px;color:var(--faint)}
.empty{padding:38px 24px;text-align:center}
.empty .ill{width:84px;height:84px;margin:0 auto 10px;border-radius:24px;display:grid;place-items:center;background:var(--grad);box-shadow:0 18px 40px -14px rgba(124,58,237,.6);color:#fff}
.empty .ill svg{width:40px;height:40px}
.steps{display:grid;gap:10px;max-width:560px;margin:18px auto 22px;text-align:start}
.step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.step .n{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--grad);color:#fff;flex:none}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:600;margin-bottom:14px;min-height:36px}
.back:hover{color:var(--text)}
.back svg{width:18px;height:18px}
[dir=rtl] .flip{transform:scaleX(-1)}
.dhead{padding:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.dmeta{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:13px;margin-top:8px}
.dmeta span{display:inline-flex;align-items:center;gap:6px}
.dmeta svg{width:15px;height:15px}
.dactions{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:230px}
.ring{--p:0;width:88px;height:88px;border-radius:50%;background:conic-gradient(var(--cyan),var(--violet) calc(var(--p)*1%),var(--bg2) 0);display:grid;place-items:center;flex:none}
.ring i{width:70px;height:70px;border-radius:50%;background:var(--card-solid);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:18px}
.drow{display:flex;gap:18px;align-items:center;min-width:0}
.hint{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.hint svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--cyan)}
.note-card{padding:12px 14px;margin-top:12px}
.tasks{display:grid;gap:10px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 16px}
.tid{font-family:ui-monospace,'SF Mono',Consolas,monospace;font-size:12px;color:var(--muted);direction:ltr;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.ttl{font-weight:700;min-width:0;line-height:1.45;overflow-wrap:anywhere}
.ttl small{display:block;color:var(--faint);font-weight:500;font-size:12.5px;margin-top:2px}
.tend{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.screens{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.scr{padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.scr .sh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.scr .sh b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.route{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--cyan);direction:ltr;unicode-bidi:isolate}
html.light .route{color:#0891B2}
.wf{background:var(--wbg);border-radius:18px;overflow:hidden;border:5px solid #1E293B;display:flex;flex-direction:column;gap:6px;padding-bottom:10px;min-height:240px;box-shadow:0 14px 30px -18px rgba(0,0,0,.6)}
.wf.web{border-width:1px;border-color:var(--line2);border-radius:12px}
.wf .url{display:flex;gap:4px;align-items:center;padding:6px 8px;background:#0f172a;direction:ltr}
.wf .url i{width:6px;height:6px;border-radius:50%;background:#334155}
.wf .hd{background:var(--wp);color:#fff;padding:10px 12px;font-weight:800;font-size:13px}
.wf .c{margin:0 8px;border-radius:9px;background:var(--wsf);padding:7px 9px;font-size:11px;color:var(--wtx);border:1px dashed rgba(100,116,139,.45)}
.wf .c.b{background:var(--wp);color:#fff;text-align:center;font-weight:800;border:0;border-radius:999px}
.wf .c.i{background:var(--wbg);border:1px solid rgba(100,116,139,.6)}
.wf .c.m{height:54px;display:grid;place-items:center;background:repeating-linear-gradient(45deg,var(--wsf),var(--wsf) 6px,transparent 6px,transparent 12px)}
.wf .c.n{display:flex;justify-content:space-around;border-style:solid}
.wf .c.n i{width:14px;height:14px;border-radius:5px;background:var(--wp);opacity:.6}
.purpose{font-size:12.5px;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
[dir=rtl] .sw{padding:8px 8px 8px 12px}
.sw i{width:30px;height:30px;border-radius:9px;border:1px solid var(--line2)}
.sw b{display:block;font-size:13px}
.sw small{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.auth{max-width:440px;margin:30px auto;padding:26px}
.inp{width:100%;min-height:48px;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);margin:6px 0 10px;direction:ltr;font-size:16px}
.inp:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.15)}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12.5px;margin:16px 0}
.or:before,.or:after{content:'';flex:1;height:1px;background:var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}
.sk{background:linear-gradient(90deg,var(--bg2) 25%,var(--line2) 50%,var(--bg2) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}
.mbar{display:none}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + var(--safe-b));z-index:40;max-width:520px;margin:0 auto;padding:12px 16px;border-radius:14px;background:var(--card-solid);border:1px solid var(--line2);box-shadow:var(--shadow);font-size:13.5px;display:none}
.toast.show{display:block}
@media (max-width:980px){.stats4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  .top-in{padding:8px 14px;gap:8px}
  .brand .t{display:none}
  main{padding:18px 14px calc(96px + var(--safe-b))}
  .hero{align-items:stretch;margin-bottom:16px}
  .hero>.btn{width:100%}
  .grid{grid-template-columns:1fr;gap:12px}
  a.pcard{padding:16px}
  .stats4{gap:10px;margin-bottom:16px}
  .stat{padding:12px 14px}.stat .v{font-size:22px}
  .dhead{grid-template-columns:1fr;padding:18px}
  .dactions{display:none}
  .drow{gap:14px;align-items:flex-start}.ring{width:68px;height:68px}.ring i{width:54px;height:54px;font-size:15px}
  .task{grid-template-columns:auto 1fr;padding:12px 14px}
  .tend{grid-column:1/-1;justify-content:flex-start}
  .screens{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .wf{min-height:200px;border-width:4px}
  .toast{bottom:calc(84px + var(--safe-b))}
  .mbar{display:flex;position:fixed;inset-inline:0;bottom:0;z-index:35;padding:10px 14px calc(10px + var(--safe-b));gap:10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .mbar .btn{flex:1}
}
@media (max-width:380px){.metrics{grid-template-columns:1fr 1fr}.metrics .metric:last-child{grid-column:1/-1}.two{grid-template-columns:1fr}.screens{grid-template-columns:1fr}}
/* ---- admin */
.tag-admin{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--grad);color:#fff}
[dir=rtl] .tag-admin{letter-spacing:0}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.tabs a{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;color:var(--muted);min-height:38px}
.tabs a svg{width:17px;height:17px}
.tabs a.on{background:var(--card-solid);color:var(--text);box-shadow:var(--shadow)}
.tabs a:hover{color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{padding:16px 18px;position:relative;overflow:hidden;min-width:0}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .k svg{width:16px;height:16px;color:var(--cyan)}
html.light .kpi .k svg{color:#0891B2}
.kpi .v{font-size:28px;font-weight:800;line-height:1.2;margin-top:4px}
.kpi .s{font-size:12px;color:var(--faint);margin-top:2px}
.sec{margin-top:26px}
.sec-h{flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.sec-h h2{margin:0}
.chart{padding:18px 18px 12px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.tip{position:fixed;z-index:50;pointer-events:none;padding:8px 10px;border-radius:10px;background:var(--card-solid);border:1px solid var(--line2);box-shadow:var(--shadow);font-size:12.5px;display:none;white-space:nowrap}
.tops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.top-card{padding:16px;min-width:0}
.top-card h3{margin:0 0 10px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.top-card h3 svg{width:16px;height:16px;color:var(--muted)}
.trow{position:relative;display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:9px;font-size:13px;margin-bottom:4px;overflow:hidden}
.trow .fill{position:absolute;inset-block:0;inset-inline-start:0;background:color-mix(in srgb,var(--cyan) 12%,transparent);border-radius:9px;z-index:0}
html.light .trow .fill{background:color-mix(in srgb,var(--violet) 10%,transparent)}
.trow span,.trow b{position:relative;z-index:1}
.trow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.trow b{font-weight:800;flex:none}
.none{color:var(--faint);font-size:13px;padding:6px 2px}
.search{position:relative;flex:1;max-width:360px}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint)}
.search input{width:100%;min-height:42px;padding:9px 12px;padding-inline-start:38px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-size:15px}
.search input:focus{outline:none;border-color:var(--cyan)}
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{font-size:12px;font-weight:700;color:var(--muted);text-align:start;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background .15s}
.tbl tbody tr:hover{background:color-mix(in srgb,var(--cyan) 5%,transparent)}
.tbl .num{font-variant-numeric:tabular-nums;font-weight:700}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;background:var(--grad)}
.who b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
.who small{display:block;color:var(--faint);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
.plan{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);white-space:nowrap}
.plan.pro{background:var(--grad);color:#fff;border:0}
.plan.starter{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 40%,transparent)}
html.light .plan.starter{color:#0891B2}
.tcard{overflow:hidden}
.mlist{display:none}
.ccard{display:grid;gap:10px;padding:14px;text-decoration:none}
.ccard .mm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ccard .mm div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-width:0}
.ccard .mm .k{font-size:11px;color:var(--muted)}
.ccard .mm .v{font-weight:800;font-size:14px}
.dgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.box{padding:16px}
.box h3{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.box h3 svg{width:17px;height:17px;flex:none;color:var(--cyan)}
html.light .box h3 svg{color:#0891B2}
.box h3 .count{font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.dev{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.dev:last-child{border-bottom:0}
.dev .ic{width:38px;height:38px;border-radius:11px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.dev .ic svg{width:18px;height:18px}
.dev .m{flex:1;min-width:0}
.dev .m b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dev .m small{color:var(--faint);font-size:12px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.danger:hover{border-color:var(--bad)}
.btn.danger.sure{background:var(--bad);color:#fff;border-color:var(--bad)}
.proj{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--bg2);overflow:hidden}
.proj summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.proj summary::-webkit-details-marker{display:none}
.proj summary b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj summary .bar{grid-column:1/-1}
.proj summary small{color:var(--faint);font-size:12px}
.proj .tl{padding:4px 14px 12px;display:grid;gap:6px}
.proj .tl div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13px}
.proj .tl .ttl{font-weight:600}
.lrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.lrow:last-child{border-bottom:0}
.lrow small{color:var(--faint);font-size:12px;grid-column:1/-1}
.mono{font-family:ui-monospace,'SF Mono',Consolas,monospace;font-size:12.5px;direction:ltr;unicode-bidi:isolate}
.seg{display:inline-flex;gap:4px;padding:3px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.seg button{border:0;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:6px 12px;border-radius:9px;cursor:pointer;min-height:32px}
.seg button.on{background:var(--card-solid);color:var(--text);box-shadow:var(--shadow)}
.vgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:16px;align-items:start}
.visit{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.visit:last-child{border-bottom:0}
.visit .ic{width:34px;height:34px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center}
.visit .ic svg{width:16px;height:16px;color:var(--muted)}
.visit .m{min-width:0}
.visit .m b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visit .m small{display:block;color:var(--faint);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visit time{font-size:12px;color:var(--faint);white-space:nowrap}
.me-chip{color:var(--ok);font-weight:800}
.lock{max-width:480px;margin:40px auto;padding:30px;text-align:center}
.mtabs{display:none}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}.tops{grid-template-columns:repeat(2,minmax(0,1fr))}.dgrid,.vgrid{grid-template-columns:1fr}}
@media (max-width:760px){
  .tabs.desk{display:none}
  .kpis{gap:10px}.kpi{padding:12px 14px}.kpi .v{font-size:22px}
  .tops{grid-template-columns:1fr}
  .tcard{display:none}
  .mlist{display:grid;gap:10px}
  .search{max-width:none}
  .chart{padding:14px 10px 8px}
  .mtabs{display:flex;position:fixed;inset-inline:0;bottom:0;z-index:35;padding:8px 10px calc(8px + var(--safe-b));gap:6px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .mtabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;text-decoration:none;font-size:11.5px;font-weight:700;color:var(--muted)}
  .mtabs a svg{width:21px;height:21px}
  .mtabs a.on{color:var(--text);background:var(--bg2)}
  .mtabs a.on svg{color:var(--cyan)}
}
@media (max-width:380px){.ccard .mm{grid-template-columns:repeat(2,minmax(0,1fr))}}

      var h = '<a class="back" href="#customers">' + I.back + esc(t().allCust) + '</a>';
      h += '<div class="card dhead"><div class="drow"><span class="av" style="width:64px;height:64px;border-radius:18px;font-size:24px">' + initial(u.name || u.email) + '</span><div style="min-width:0">' +
        '<div class="eyebrow">' + esc(t().customers) + '</div><h1 class="ltr" style="margin:0;font-size:clamp(20px,3.4vw,30px)">' + esc(u.email) + '</h1>' +
        '<div class="dmeta"><span>' + planChip(u.plan) + '</span>' + (u.org ? '<span>' + I.users + '<span dir="auto">' + esc(u.org) + '</span></span>' : '') +
        '<span>' + I.cal + esc(t().joined) + ' ' + esc(date(u.createdAt)) + '</span>' + (u.activeUntil && u.plan !== 'free' ? '<span>' + esc(t().activeUntil) + ' ' + esc(date(u.activeUntil)) + '</span>' : '') + '</div></div></div></div>';
      h += '<div class="kpis" style="margin-top:14px">' + kpi(I.coin, t().thCredits, '<span class="grad-text">' + num(u.credits) + '</span>', '') + kpi(I.pc, t().kDev, num(live), '') +
        kpi(I.layers, t().projects, num(c.projects.length), '') + kpi(I.bolt, t().thSpent, num(spent), esc(t().charges) + ' · ' + num(c.charges.length)) + '</div>';

      var devs = c.devices.length ? c.devices.map(function (d) {
        return '<div class="dev"><span class="ic">' + I.pc + '</span><div class="m"><b dir="auto">' + esc(d.name) + '</b><small>' + esc(t().linked) + ' ' + esc(date(d.created_at)) + ' · ' + esc(t().lastUsed) + ' ' + esc(d.last_used_at ? ago(d.last_used_at) : t().never) + '</small></div>' +
          (d.revoked_at ? '<span class="chip c-off">' + esc(t().revoked) + '</span>' : '<button class="btn sm danger" type="button" data-revoke="' + esc(d.id) + '">' + esc(t().revoke) + '</button>') + '</div>';
      }).join('') : '<div class="none">' + esc(t().noDev) + '</div>';

      var projs = c.projects.length ? c.projects.map(function (p) {
        var done = p.tasks.filter(function (x) { return x.state === 'done'; }).length;
        var map = { done: 'c-ok', awaiting: 'c-warn', next: 'c-info', failed: 'c-warn' };
        return '<details class="proj"><summary><b dir="auto">' + esc(p.name) + '</b><span class="chip c-info ltr">' + done + '/' + p.tasks.length + '</span>' +
          '<small style="grid-column:1/-1">' + esc(p.device) + ' · ' + num(p.screens) + ' ' + esc(t().screens) + ' · ' + esc(ago(p.updatedAt)) + '</small><div class="bar"><i style="width:' + pct(done, p.tasks.length) + '%"></i></div></summary>' +
          '<div class="tl">' + p.tasks.map(function (x) { return '<div><span class="tid">' + esc(x.id) + '</span><span class="ttl" dir="auto">' + esc(x.title) + '</span><span class="chip ' + (map[x.state] || 'c-off') + '">' + esc(t().st[x.state] || x.state) + '</span></div>'; }).join('') + '</div></details>';
      }).join('') : '<div class="none">' + esc(t().noProj) + '</div>';

      var chs = c.charges.length ? c.charges.map(function (x) {
        return '<div class="lrow"><span><span class="tid">' + esc(x.task_id) + '</span> <span dir="auto">' + esc(x.project) + '</span></span><b>−' + num(x.amount) + '</b><small>' + esc(x.mode === 'own_key' ? t().ownKey : t().elyvoriModel) + ' · ' + num(x.files) + ' ' + esc(t().files) + ' · ' + esc(ago(x.created_at)) + '</small></div>';
      }).join('') : '<div class="none">' + esc(t().noCharges) + '</div>';

      var vis = c.visits.length ? c.visits.map(function (x) {
        return '<div class="lrow"><span class="mono">' + esc(x.path) + '</span><span style="color:var(--faint);font-size:12px">' + esc(ago(x.at)) + '</span><small>' + esc([devName(x.device), x.browser, x.os].filter(Boolean).join(' · ')) + '</small></div>';
      }).join('') : '<div class="none">' + esc(t().noVisits) + '</div>';

      h += '<div class="dgrid sec"><div style="display:grid;gap:16px"><div class="card box"><h3>' + I.layers + esc(t().projects) + ' <span class="count">' + c.projects.length + '</span></h3>' + projs + '</div>' +
        '<div class="card box"><h3>' + I.coin + esc(t().charges) + ' <span class="count">' + c.charges.length + '</span></h3>' + chs + '</div></div>' +
        '<div style="display:grid;gap:16px"><div class="card box"><h3>' + I.pc + esc(t().devices) + ' <span class="count">' + live + '</span></h3>' + devs + '</div>' +
        '<div class="card box"><h3>' + I.eye + esc(t().recent) + '</h3>' + vis + '</div></div></div>';
      app.innerHTML = h;

      app.querySelectorAll('[data-revoke]').forEach(function (b) {
        b.onclick = function () {
          if (!b.classList.contains('sure')) {
            b.classList.add('sure'); b.textContent = t().sure;
            setTimeout(function () { if (document.body.contains(b) && !b.disabled) { b.classList.remove('sure'); b.textContent = t().revoke; } }, 4000);
            return;
          }
          b.disabled = true;
          call('/admin/factory/devices/' + encodeURIComponent(b.getAttribute('data-revoke')), 'DELETE').then(function () {
            toast(t().revokedOk); delete cache['/admin/factory/customers']; customer(id, true);
          }).catch(function (e) { if (e.message === 'auth' || e.message === 'forbidden') return fail(e); b.disabled = false; toast(t().revokeFail); });
        };
      });
    }).catch(fail);
  }

  // ---------------------------------------------------------------- visitors
  function visitors(fresh) {
    var path = '/admin/analytics?days=' + days;
    if (!cache[path] || fresh) skeleton();
    load(path, fresh).then(function (a) {
      var seg = '<div class="seg" role="group">' + [[7, 'd7'], [30, 'd30'], [90, 'd90']].map(function (x) { return '<button type="button" data-days="' + x[0] + '" class="' + (x[0] === days ? 'on' : '') + '">' + esc(t()[x[1]]) + '</button>'; }).join('') + '</div>';
      var h = hero(t().visitors, t().leadV, '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' + seg + refreshBtn() + '</div>');
      var people = a.people.length ? a.people.map(function (p) {
        return '<div class="visit"><span class="av" style="width:34px;height:34px;border-radius:10px;font-size:13px">' + initial(p.name || p.email) + '</span><div class="m"><b class="ltr">' + esc(p.email) + '</b><small>' + num(p.views) + ' ' + esc(t().views) + ' · ' + num(p.pages) + ' ' + esc(t().pages) + '</small></div><time>' + esc(ago(p.last_seen)) + '</time></div>';
      }).join('') : '<div class="none">' + esc(t().none) + '</div>';
      var recent = a.recent.length ? a.recent.map(function (x) {
        var who = x.email ? '<span class="me-chip ltr">' + esc(x.email) + '</span>' : esc(t().anon) + ' <span class="mono" style="color:var(--faint)">#' + esc(x.visitor) + '</span>';
        var from = x.ref_host ? ' · ' + esc(x.ref_host) : '';
        return '<div class="visit"><span class="ic">' + devIcon(x.device) + '</span><div class="m"><b><span class="mono" style="font-size:13px">' + esc(x.path) + '</span></b><small>' + who + ' · ' + esc([x.browser, x.os].filter(Boolean).join(' / ')) + (x.tz ? ' · ' + esc(x.tz) : '') + from + '</small></div><time>' + esc(ago(x.at)) + '</time></div>';
      }).join('') : '<div class="none">' + esc(t().none) + '</div>';
      h += '<div class="vgrid"><div style="display:grid;gap:16px"><div class="card box"><h3>' + I.user + esc(t().people) + ' <span class="count">' + a.people.length + '</span></h3>' + people + '</div>' +
        topList(t().topPages, I.file, a.pages) + topList(t().refs, I.link, a.refs) + topList(t().oses, I.pc, a.oses) + '</div>' +
        '<div class="card box"><h3>' + I.eye + esc(t().recentV) + '</h3>' + recent + '</div></div>';
      app.innerHTML = h;
      app.querySelectorAll('[data-days]').forEach(function (b) { b.onclick = function () { days = +b.getAttribute('data-days'); visitors(); }; });
    }).catch(fail);
  }

  // ---------------------------------------------------------------- router
  function route(keepScroll) {
    if (location.hash.indexOf('elyvori_auth') >= 0) {
      var hp = new URLSearchParams(location.hash.slice(1));
      if (hp.get('elyvori_auth')) { store('elyvori_token', hp.get('elyvori_auth')); store('elyvori_user', JSON.stringify({ email: hp.get('email') || '', organizationName: hp.get('org') || '' })); }
      history.replaceState(null, '', location.pathname); cache = {}; me = null;
    }
    chrome();
    if (!token()) return login();
    var go = function () {
      chrome();
      var h = location.hash.slice(1), m = h.match(/^c=(.+)$/);
      if (m) customer(decodeURIComponent(m[1])); else if (h === 'customers') customers(); else if (h === 'visitors') visitors(); else overview();
      if (keepScroll !== true) window.scrollTo(0, 0);
    };
    if (me) return go();
    skeleton();
    call('/admin/factory/me').then(function (r) { me = r; go(); }).catch(fail);
  }
  window.addEventListener('hashchange', function () { route(); });
  route();
})();
</script>
</body>
</html>
