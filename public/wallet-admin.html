<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>لوحة Elyvori Pay | Elyvori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem('elyvori_theme');var d=t?t==='dark':!matchMedia('(prefers-color-scheme: light)').matches;document.documentElement.classList.add(d?'dark':'light');}catch(e){document.documentElement.classList.add('dark');}})();</script>
<style>
:root{--bg:#070a14;--card:#0e1324;--card2:#121a30;--line:#1f2740;--text:#e8ecf7;--muted:#9aa5c0;--accent:#7c5cff;--accent2:#22d3ee;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}
html.light{--bg:#f6f7fb;--card:#fff;--card2:#f3f5fa;--line:#e3e7f0;--text:#141a2b;--muted:#5a6580;--accent:#5b3df5;--accent2:#0891b2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden}
body{font-family:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
a{color:inherit}
.ltr{direction:ltr;unicode-bidi:isolate}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:17px}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#0e7490,#6d28d9);display:grid;place-items:center;color:#fff;font-size:15px}
.btn{font:inherit;font-size:14px;font-weight:700;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.okb{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
main{max-width:1180px;margin:0 auto;padding:18px 16px 70px}
h1{font-size:clamp(22px,4vw,30px);margin:4px 0 2px;font-weight:800}
h2{font-size:18px;margin:22px 0 10px;font-weight:800}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.pill{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap;display:inline-block}
.p-ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.p-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.p-bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.p-info{background:color-mix(in srgb,var(--accent2) 18%,transparent);color:var(--accent2)}
.p-mute{background:var(--card2);color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font:inherit;font-size:14px;font-weight:700;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.stat b{display:block;font-size:22px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat span{color:var(--muted);font-size:13px}
.stat.money b{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:0}
.row.click{cursor:pointer}
.row.click:hover{border-color:var(--accent)}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .main small{color:var(--muted);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:800;white-space:nowrap}
.amt.in{color:var(--ok)}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:color-mix(in srgb,var(--accent) 22%,transparent);flex-shrink:0}
.search{width:100%;font:inherit;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);margin-bottom:12px}
select.search{width:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv .k{color:var(--muted)}
.empty,.msg{text-align:center;color:var(--muted);padding:36px 10px;background:var(--card);border:1px dashed var(--line);border-radius:18px}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bar i{display:block;width:100%;max-width:26px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--accent2),var(--accent));min-height:3px}
.bar small{font-size:10.5px;color:var(--muted);white-space:nowrap}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(560px,100vw);background:var(--bg);border-inline-end:1px solid var(--line);z-index:41;overflow-y:auto;transform:translateX(100%);transition:transform .25s;padding:16px 16px 60px}
.drawer.open{transform:none}
.drawer-bg.open{display:block}
.drawer-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.wallets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;width:min(420px,100%)}
.modal h3{margin:0 0 6px}
.modal p{margin:0 0 12px;color:var(--muted);font-size:14px}
.modal textarea,.modal select{width:100%;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);margin-bottom:12px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:70;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (max-width:820px){.two{grid-template-columns:1fr}}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.brand .t{display:none}.wallets{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="/"><span class="logo">₪</span><span class="t">Elyvori Pay</span></a>
  <div style="display:flex;gap:8px;align-items:center">
    <span id="mode"></span>
    <button class="btn" id="refresh" type="button">↻ تحديث</button>
    <a class="btn" href="/">الرئيسية</a>
  </div>
</div></header>
<main>
  <h1>لوحة تحكم المحفظة</h1>
  <p class="sub">كل المستخدمين والأرصدة والعمليات بالشيكل والدولار والدينار — مع تدقيق الدفاتر وسجل كل إجراء.</p>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="overview" type="button">نظرة عامة</button>
    <button class="tab" data-tab="users" type="button">المستخدمون</button>
    <button class="tab" data-tab="entries" type="button">العمليات</button>
    <button class="tab" data-tab="commerce" type="button">البطاقات والمبيعات</button>
    <button class="tab" data-tab="audit" type="button">سجل الإجراءات</button>
  </nav>
  <div id="app"><div class="msg">جاري التحميل…</div></div>
</main>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<div class="modal-bg" id="modalBg">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="mTitle"></h3>
    <p id="mText"></p>
    <div id="mBody"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" id="mCancel" type="button">إلغاء</button>
      <button class="btn primary" id="mOk" type="button">تأكيد</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var API = 'https://elyvori-api.onrender.com';
  var app = document.getElementById('app');
  var state = { tab: 'overview', q: '', type: '', auditQ: '' };
  var SYM = { ILS: '₪', USD: '$', JOD: 'JD' };
  var TYPES = { transfer: 'تحويل', topup: 'شحن', withdraw: 'سحب', request_pay: 'دفع طلب', purchase: 'شراء خدمة', reversal: 'استرجاع' };
  var TOPUP = { pending: ['بانتظار الدفع', 'p-info'], paid: ['مدفوع', 'p-ok'], failed: ['فشل', 'p-bad'], expired: ['انتهت', 'p-mute'] };
  var STATUS = { active: ['نشط', 'p-ok'], frozen: ['مجمّد', 'p-warn'], closed: ['مغلق', 'p-bad'] };
  var KYC = ['أساسي', 'موثّق', 'موثّق بالكامل'];
  var ERR = {
    insufficient_funds: 'رصيد المستلم ما بكفي لإرجاع العملية.', already_reversed: 'هاي العملية مسترجعة من قبل.', reason_required: 'لازم تكتب السبب.',
    not_wallet_admin: 'هاللوحة لأدمن المحفظة بس.', not_reversible: 'هاي العملية ما بتنسترجع (مسترجعة من قبل أو هي نفسها استرجاع).', entry_not_found: 'العملية مش موجودة.'
  };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function token() { try { return localStorage.getItem('elyvori_token'); } catch (e) { return null; } }
  function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); setTimeout(function () { el.classList.remove('show'); }, 2600); }
  function when(iso) { try { return new Date(iso).toLocaleString('ar', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
  function group(v) { var s = String(v == null ? '0' : v); var neg = s.charAt(0) === '-'; if (neg) s = s.slice(1); var p = s.split('.'); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ','); return (neg ? '-' : '') + p.join('.'); }
  function money(v, c) { return '<span class="ltr">' + esc(group(v)) + ' ' + esc(SYM[c] || c || '') + '</span>'; }
  function party(p) { return p ? esc(p.name || '') + ' <span class="ltr" style="color:var(--muted)">' + esc(p.phone || '') + '</span>' : ''; }
  function note(d) { return d === 'Sandbox top-up' ? 'شحن تجريبي' : d === 'Sandbox withdrawal' ? 'سحب تجريبي' : d === 'Card top-up' ? 'شحن بالبطاقة' : (d || ''); }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Content-Type': 'application/json', Authorization: 'Bearer ' + token() }, opts.headers || {});
    return fetch(API + path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (body) {
        if (r.status === 401) throw new Error('auth');
        if (r.status === 403) throw new Error('forbidden');
        if (!r.ok) { var m = body && body.message; throw new Error(Array.isArray(m) ? m[0] : (m || 'http ' + r.status)); }
        return body;
      });
    });
  }
  function fail(e) {
    if (e.message === 'auth') app.innerHTML = '<div class="msg">انتهت جلستك أو ما سجّلت دخول.<br><br><a class="btn primary" href="/">سجّل دخول بحساب الأدمن</a></div>';
    else if (e.message === 'forbidden') app.innerHTML = '<div class="msg">هاللوحة لأدمن Elyvori Pay بس.</div>';
    else app.innerHTML = '<div class="msg">ما قدرت أحمّل البيانات. جرّب "تحديث" كمان شوي (إذا السيرفر نايم بياخد دقيقة).</div>';
  }

  // ------------------------------------------------------------- modal (reason / choice)
  function ask(title, text, bodyHtml) {
    return new Promise(function (resolve) {
      var bg = document.getElementById('modalBg');
      document.getElementById('mTitle').textContent = title;
      document.getElementById('mText').textContent = text;
      document.getElementById('mBody').innerHTML = bodyHtml;
      bg.classList.add('open');
      var first = bg.querySelector('textarea,select'); if (first) setTimeout(function () { first.focus(); }, 50);
      function done(ok) {
        bg.classList.remove('open');
        document.getElementById('mOk').onclick = null; document.getElementById('mCancel').onclick = null;
        if (!ok) return resolve(null);
        var r = bg.querySelector('[name=reason]'), l = bg.querySelector('[name=level]');
        resolve({ reason: r ? r.value.trim() : '', level: l ? l.value : '' });
      }
      document.getElementById('mOk').onclick = function () { done(true); };
      document.getElementById('mCancel').onclick = function () { done(false); };
    });
  }
  var REASON = '<textarea name="reason" rows="3" maxlength="300" placeholder="السبب (إلزامي — بينحفظ بسجل الإجراءات)"></textarea>';

  // ------------------------------------------------------------- overview
  function overview() {
    app.innerHTML = '<div class="msg">جاري التحميل…</div>';
    Promise.all([api('/wallet/admin/overview'), api('/wallet/admin/reconcile')]).then(function (r) {
      var o = r[0], rec = r[1], cur = o.currencies || ['ILS', 'USD', 'JOD'];
      document.getElementById('mode').innerHTML = o.sandbox ? '<span class="pill p-warn">وضع تجريبي</span>' : '<span class="pill p-ok">مباشر</span>';
      var h = '<div class="stats">' +
        '<div class="stat"><b>' + esc(o.users.total) + '</b><span>كل المستخدمين</span></div>' +
        '<div class="stat"><b>' + esc(o.users.today) + '</b><span>سجّلوا اليوم</span></div>' +
        '<div class="stat"><b>' + esc(o.users.frozen) + '</b><span>حسابات مجمّدة</span></div>' +
        '<div class="stat"><b>' + (rec.ok ? '<span style="color:var(--ok)">✓ متوازنة</span>' : '<span style="color:var(--bad)">✕ في مشكلة</span>') + '</b><span>تدقيق الدفاتر</span></div>' +
        '</div>';
      h += '<h2>الأموال المحفوظة بالمحافظ</h2><div class="stats">';
      cur.forEach(function (c) { h += '<div class="stat money"><b>' + money(o.held[c] || '0', c) + '</b><span>أرصدة ' + esc(c) + '</span></div>'; });
      h += '<div class="stat"><b>' + cur.map(function (c) { return money(o.fees[c] || '0', c); }).join('<br>') + '</b><span>إيرادات الرسوم</span></div></div>';

      // last 14 days chart (number of operations)
      var days = {}; (o.last14Days || []).forEach(function (d) { days[d.day] = (days[d.day] || 0) + d.count; });
      var keys = []; for (var i = 13; i >= 0; i--) { var dt = new Date(Date.now() - i * 864e5); keys.push(dt.toISOString().slice(0, 10)); }
      var max = Math.max.apply(null, keys.map(function (k) { return days[k] || 0; }).concat([1]));
      var chart = '<div class="chart ltr">' + keys.map(function (k) {
        var n = days[k] || 0; return '<div class="bar" title="' + esc(k) + ': ' + n + '"><small>' + (n || '') + '</small><i style="height:' + Math.max(3, Math.round(n / max * 110)) + 'px"></i><small>' + esc(k.slice(8)) + '</small></div>';
      }).join('') + '</div>';

      var today = (o.today || []).length ? (o.today || []).map(function (t) {
        return '<div class="row"><div class="main"><b>' + esc(TYPES[t.type] || t.type) + '</b><small>' + esc(t.count) + ' عملية</small></div><span class="amt">' + money(t.total, t.currency) + '</span></div>';
      }).join('') : '<div class="empty" style="padding:20px">ما في عمليات اليوم.</div>';

      h += '<div class="two" style="margin-top:12px"><div class="card"><b>العمليات آخر 14 يوم</b>' + chart + '</div>' +
        '<div class="card"><b>اليوم</b><div class="list" style="margin-top:10px">' + today + '</div></div></div>';

      h += '<h2>تدقيق الدفاتر</h2><div class="card">' + (rec.ok
        ? '<span class="pill p-ok">كل الدفاتر متوازنة</span><p class="sub" style="margin:8px 0 0">مجموع كل عملة = صفر، وكل رصيد = مجموع حركاته، وما في رصيد سالب.</p>'
        : '<span class="pill p-bad">في مشاكل</span><ul>' + (rec.problems || []).map(function (p) { return '<li class="ltr">' + esc(p) + '</li>'; }).join('') + '</ul>') + '</div>';
      app.innerHTML = h;
    }).catch(fail);
  }

  // ------------------------------------------------------------- users
  function users() {
    app.innerHTML = '<input class="search" id="uq" type="search" placeholder="ابحث بالاسم أو الجوال أو الإيميل…" value="' + esc(state.q) + '"><div id="ulist"><div class="msg">جاري التحميل…</div></div>';
    var uq = document.getElementById('uq'), t;
    uq.addEventListener('input', function () { clearTimeout(t); t = setTimeout(function () { state.q = uq.value.trim(); loadUsers(); }, 350); });
    loadUsers();
  }
  function loadUsers() {
    var box = document.getElementById('ulist');
    api('/wallet/admin/users?q=' + encodeURIComponent(state.q)).then(function (list) {
      if (!list.length) { box.innerHTML = '<div class="empty">ما في مستخدمين' + (state.q ? ' بهالبحث' : ' لسا') + '.</div>'; return; }
      box.innerHTML = '<div class="list">' + list.map(function (u) {
        var st = STATUS[u.status] || [u.status, 'p-mute'];
        return '<div class="row click" data-user="' + esc(u.id) + '"><span class="av">' + esc((u.name || '?').trim().charAt(0).toUpperCase()) + '</span>' +
          '<div class="main"><b>' + esc(u.name) + '</b><small><span class="ltr">' + esc(u.phone) + '</span>' + (u.email ? ' · ' + esc(u.email) : '') + ' · ' + esc(when(u.created_at)) + '</small></div>' +
          '<span class="pill p-info">' + esc(KYC[u.kyc_level] || u.kyc_level) + '</span><span class="pill ' + st[1] + '">' + esc(st[0]) + '</span></div>';
      }).join('') + '</div>';
    }).catch(function (e) { if (e.message === 'auth' || e.message === 'forbidden') fail(e); else box.innerHTML = '<div class="msg">ما قدرت أحمّل المستخدمين.</div>'; });
  }

  var drawer = document.getElementById('drawer'), drawerBg = document.getElementById('drawerBg');
  function closeDrawer() { drawer.classList.remove('open'); drawerBg.classList.remove('open'); drawer.setAttribute('aria-hidden', 'true'); }
  drawerBg.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });

  function openUser(id) {
    drawer.innerHTML = '<div class="msg">جاري التحميل…</div>';
    drawer.classList.add('open'); drawerBg.classList.add('open'); drawer.setAttribute('aria-hidden', 'false');
    api('/wallet/admin/users/' + encodeURIComponent(id)).then(function (d) {
      var p = d.profile, st = STATUS[p.status] || [p.status, 'p-mute'];
      var h = '<div class="drawer-h"><h2 style="margin:0">' + esc(p.name) + '</h2><button class="btn sm" id="dClose" type="button">✕</button></div>' +
        '<div class="kv"><span class="k">الجوال</span><span class="ltr" style="text-align:right">' + esc(p.phone) + '</span>' +
        '<span class="k">الإيميل</span><span>' + esc(p.email || '—') + '</span>' +
        '<span class="k">الحالة</span><span><span class="pill ' + st[1] + '">' + esc(st[0]) + '</span></span>' +
        '<span class="k">مستوى التحقق</span><span>' + esc(KYC[p.kycLevel] || p.kycLevel) + '</span>' +
        '<span class="k">المعرّف</span><span class="ltr" style="text-align:right;font-size:12px;color:var(--muted)">' + esc(p.id) + '</span></div>';
      h += '<div class="wallets">' + (p.wallets || []).map(function (w) {
        return '<div class="stat money"><b>' + money(w.balance, w.currency) + '</b><span>حد يومي ' + money(w.limits.daily, w.currency) + '</span></div>';
      }).join('') + '</div>';
      h += '<div class="acts">' +
        (p.status === 'active' ? '<button class="btn danger sm" data-act="frozen" type="button">🧊 تجميد</button>' : '<button class="btn okb sm" data-act="active" type="button">✓ تفعيل</button>') +
        (p.status !== 'closed' ? '<button class="btn danger sm" data-act="closed" type="button">إغلاق الحساب</button>' : '') +
        '<button class="btn sm" data-act="kyc" type="button">مستوى التحقق</button>' +
        (p.status !== 'closed' ? '<button class="btn sm" data-act="pinreset" type="button">🔑 نسي الرمز السري</button>' : '') +
        '<button class="btn sm" data-act="audit" type="button">سجل إجراءاته</button></div>';
      h += '<h2>الأجهزة (' + (d.devices || []).length + ')</h2><div class="list">' + ((d.devices || []).map(function (v) {
        return '<div class="row"><div class="main"><b>' + esc(v.deviceName) + '</b><small>آخر استخدام: ' + esc(when(v.lastSeenAt)) + '</small></div></div>';
      }).join('') || '<div class="empty" style="padding:16px">ما في أجهزة مسجّلة.</div>') + '</div>';
      h += '<h2>آخر الحركات</h2><div class="list">' + ((d.history || []).map(txRow).join('') || '<div class="empty" style="padding:16px">ما في حركات.</div>') + '</div>';
      drawer.innerHTML = h;
      document.getElementById('dClose').onclick = closeDrawer;
      drawer.querySelectorAll('[data-act]').forEach(function (b) {
        b.onclick = function () { userAction(p, b.getAttribute('data-act')); };
      });
    }).catch(function (e) { drawer.innerHTML = '<div class="msg">' + esc(ERR[e.message] || 'ما قدرت أحمّل المستخدم.') + '</div>'; });
  }

  function userAction(p, act) {
    if (act === 'audit') { closeDrawer(); state.auditQ = p.id; switchTab('audit'); return; }
    // ELYVORI-PIN-RESET: one-time code for a customer who forgot the PIN
    if (act === 'pinreset') {
      ask('نسي الرمز السري', 'تأكد أول إنه صاحب المحفظة (بيحكي معك من رقم ' + p.phone + ' وبيعرف اسمه وآخر حركاته). بعدين بنطلعلك كود لمرة وحدة (30 دقيقة) بيستخدمه بصفحة elyvori-hq.vercel.app/wallet-reset.html.', '')
        .then(function (r) {
          if (!r) return;
          api('/wallet/admin/users/' + encodeURIComponent(p.id) + '/pin-reset', { method: 'POST', body: '{}' })
            .then(function (x) {
              ask('الكود جاهز', 'ابعته للعميل على رقم ' + x.phone + ' بس — بيشتغل ' + x.expiresInMinutes + ' دقيقة ولمرة وحدة.',
                '<div class="ltr" style="font-size:34px;font-weight:900;letter-spacing:8px;text-align:center;padding:10px;border:1px dashed var(--line);border-radius:14px">' + esc(x.code) + '</div>' +
                '<div style="margin-top:8px;font-size:13px;color:var(--muted)">الرابط: elyvori-hq.vercel.app/wallet-reset.html</div>');
              openUser(p.id);
            })
            .catch(function (e) { toast(ERR[e.message] || e.message); });
        });
      return;
    }
    if (act === 'kyc') {
      ask('مستوى التحقق', 'بيغيّر حدود الإرسال اليومية والشهرية لهالمستخدم.',
        '<select name="level">' + KYC.map(function (k, i) { return '<option value="' + i + '"' + (i === p.kycLevel ? ' selected' : '') + '>' + esc(k) + '</option>'; }).join('') + '</select>')
        .then(function (r) {
          if (!r) return;
          api('/wallet/admin/users/' + encodeURIComponent(p.id) + '/kyc', { method: 'POST', body: JSON.stringify({ level: Number(r.level) }) })
            .then(function () { toast('تم تغيير مستوى التحقق'); openUser(p.id); loadUsersIfOpen(); })
            .catch(function (e) { toast(ERR[e.message] || e.message); });
        });
      return;
    }
    var titles = { frozen: ['تجميد الحساب', 'ما بيقدر يرسل أو يستلم، وبينطلع من كل أجهزته.'], active: ['تفعيل الحساب', 'بيرجع يقدر يستخدم محفظته.'], closed: ['إغلاق الحساب', 'إغلاق نهائي — بيطلع من كل أجهزته.'] };
    ask(titles[act][0], titles[act][1], REASON).then(function (r) {
      if (!r) return;
      if (!r.reason) { toast('لازم تكتب السبب'); return; }
      api('/wallet/admin/users/' + encodeURIComponent(p.id) + '/status', { method: 'POST', body: JSON.stringify({ status: act, reason: r.reason }) })
        .then(function () { toast('تم ✓'); openUser(p.id); loadUsersIfOpen(); })
        .catch(function (e) { toast(ERR[e.message] || e.message); });
    });
  }
  function loadUsersIfOpen() { if (state.tab === 'users' && document.getElementById('ulist')) loadUsers(); }

  // ------------------------------------------------------------- entries
  function txRow(t) {
    var reversed = t.status === 'reversed';
    var who = t.from && t.to ? party(t.from) + ' ← ' + party(t.to) : (t.from ? party(t.from) : t.to ? party(t.to) : esc(note(t.description)));
    var sign = t.change ? (String(t.change).charAt(0) === '-' ? '' : '+') : '';
    return '<div class="row"><div class="main"><b>' + esc(TYPES[t.type] || t.type) + (reversed ? ' <span class="pill p-warn">مسترجعة</span>' : '') + '</b>' +
      '<small>' + who + ' · ' + esc(when(t.createdAt)) + '</small></div>' +
      '<span class="amt' + (sign === '+' ? ' in' : '') + '"' + (reversed ? ' style="text-decoration:line-through"' : '') + '>' + (t.change ? sign + money(t.change, t.currency) : money(t.amount, t.currency)) + '</span></div>';
  }
  function entries() {
    app.innerHTML = '<select class="search" id="etype"><option value="">كل الأنواع</option>' +
      Object.keys(TYPES).map(function (k) { return '<option value="' + k + '"' + (state.type === k ? ' selected' : '') + '>' + esc(TYPES[k]) + '</option>'; }).join('') +
      '</select><div id="elist"><div class="msg">جاري التحميل…</div></div>';
    document.getElementById('etype').onchange = function () { state.type = this.value; loadEntries(); };
    loadEntries();
  }
  function loadEntries() {
    var box = document.getElementById('elist');
    api('/wallet/admin/entries?limit=100&type=' + encodeURIComponent(state.type)).then(function (list) {
      if (!list.length) { box.innerHTML = '<div class="empty">ما في عمليات.</div>'; return; }
      box.innerHTML = '<div class="list">' + list.map(function (t) {
        var canReverse = t.status === 'completed' && t.type !== 'reversal';
        var who = t.from && t.to ? party(t.from) + ' ← ' + party(t.to) : esc(note(t.description));
        return '<div class="row"><div class="main"><b>' + esc(TYPES[t.type] || t.type) + ' · ' + money(t.amount, t.currency) +
          (t.fee && Number(t.fee) ? ' <small style="display:inline;color:var(--muted)">(رسوم ' + money(t.fee, t.currency) + ')</small>' : '') +
          (t.status === 'reversed' ? ' <span class="pill p-warn">مسترجعة</span>' : '') + '</b>' +
          '<small>' + who + ' · ' + esc(when(t.createdAt)) + ' · <span class="ltr">' + esc(t.id) + '</span></small></div>' +
          (canReverse ? '<button class="btn danger sm" data-rev="' + esc(t.id) + '" type="button">↩ استرجاع</button>' : '') + '</div>';
      }).join('') + '</div>';
      box.querySelectorAll('[data-rev]').forEach(function (b) {
        b.onclick = function () {
          var id = b.getAttribute('data-rev');
          ask('استرجاع العملية', 'بيرجّع المبلغ والرسوم لصاحبها بعملية عكسية. ما بنحذف إشي من الدفاتر.', REASON).then(function (r) {
            if (!r) return;
            if (!r.reason) { toast('لازم تكتب السبب'); return; }
            b.disabled = true;
            api('/wallet/admin/entries/' + encodeURIComponent(id) + '/reverse', { method: 'POST', body: JSON.stringify({ reason: r.reason }) })
              .then(function () { toast('تم الاسترجاع ✓'); loadEntries(); })
              .catch(function (e) { b.disabled = false; toast(ERR[e.message] || e.message); });
          });
        };
      });
    }).catch(function (e) { if (e.message === 'auth' || e.message === 'forbidden') fail(e); else box.innerHTML = '<div class="msg">ما قدرت أحمّل العمليات.</div>'; });
  }

  // ------------------------------------------------------------- audit
  var ACTIONS = {
    register: 'تسجيل جديد', login: 'دخول', login_new_device: 'دخول من جهاز جديد', pin_wrong: 'رمز سري غلط', pin_locked: 'قفل بعد محاولات خاطئة',
    pin_changed: 'تغيير الرمز السري', pin_reset_platform: 'تغيير الرمز (نسيه — من حسابه بالموقع)', pin_reset_code: 'تغيير الرمز (نسيه — بكود الدعم)', pin_reset_code_created: 'إصدار كود تصفير الرمز (أدمن)', device_revoked: 'إخراج جهاز', user_frozen: 'تجميد (أدمن)', user_active: 'تفعيل (أدمن)', user_closed: 'إغلاق (أدمن)',
    kyc_level_set: 'تغيير مستوى التحقق', entry_reversed: 'استرجاع عملية', transfer: 'تحويل', request_created: 'طلب دفع', request_paid: 'دفع طلب',
    request_declined: 'رفض طلب', request_cancelled: 'إلغاء طلب', topup: 'شحن', withdraw: 'سحب',
    stripe_topup_started: 'بدء شحن بالبطاقة', stripe_topup_paid: 'شحن بالبطاقة (مدفوع)', stripe_amount_mismatch: 'تنبيه: مبلغ Stripe مختلف', stripe_session_mismatch: 'تنبيه: جلسة Stripe غريبة',
    purchase: 'شراء خدمة من المحفظة', chat_linked: 'ربط المحفظة بشات الموقع', refresh_reuse_detected: 'محاولة إعادة استخدام جلسة قديمة (أمان)', sandbox_topup: 'شحن تجريبي', sandbox_withdraw: 'سحب تجريبي', velocity_block: 'منع: عمليات كثيرة بوقت قصير'
  };
  function audit() {
    app.innerHTML = '<input class="search" id="aq" type="search" placeholder="فلترة بمعرّف مستخدم أو عملية أو إيميل أدمن…" value="' + esc(state.auditQ) + '"><div id="alist"><div class="msg">جاري التحميل…</div></div>';
    var aq = document.getElementById('aq'), t;
    aq.addEventListener('input', function () { clearTimeout(t); t = setTimeout(function () { state.auditQ = aq.value.trim(); loadAudit(); }, 350); });
    loadAudit();
  }
  function loadAudit() {
    var box = document.getElementById('alist');
    api('/wallet/admin/audit?q=' + encodeURIComponent(state.auditQ)).then(function (list) {
      if (!list.length) { box.innerHTML = '<div class="empty">ما في إجراءات.</div>'; return; }
      box.innerHTML = '<div class="list">' + list.map(function (a) {
        var data = a.data && typeof a.data === 'object' ? a.data : null;
        var extra = data && data.reason ? ' · السبب: ' + esc(data.reason) : '';
        return '<div class="row"><span class="pill ' + (a.actor_type === 'admin' ? 'p-warn' : 'p-mute') + '">' + (a.actor_type === 'admin' ? 'أدمن' : 'مستخدم') + '</span>' +
          '<div class="main"><b>' + esc(ACTIONS[a.action] || a.action) + '</b><small>' + esc(when(a.created_at)) + ' · <span class="ltr">' + esc(a.actor_id || '') + '</span>' + extra + '</small></div></div>';
      }).join('') + '</div>';
    }).catch(function (e) { if (e.message === 'auth' || e.message === 'forbidden') fail(e); else box.innerHTML = '<div class="msg">ما قدرت أحمّل السجل.</div>'; });
  }

  // ------------------------------------------------------------- card top-ups + sales
  function commerce() {
    app.innerHTML = '<div class="msg">جاري التحميل…</div>';
    Promise.all([api('/wallet/admin/commerce'), api('/wallet/admin/topups'), api('/wallet/admin/orders')]).then(function (r) {
      var c = r[0], tops = r[1], orders = r[2], st = c.stripe || {};
      var stripeState = !st.configured ? '<span class="pill p-bad">Stripe مش مربوط</span>'
        : st.live ? '<span class="pill p-ok">Stripe حقيقي</span>' : '<span class="pill p-warn">Stripe وضع اختبار</span>';
      var h = '<div class="stats">' +
        '<div class="stat"><b>' + stripeState + '</b><span>الدفع بالبطاقة</span></div>' +
        '<div class="stat"><b>' + (st.webhookSigned ? '<span style="color:var(--ok)">✓ موقّع</span>' : '<span style="color:var(--warn)">بدون توقيع</span>') + '</b><span>Webhook</span></div>' +
        '<div class="stat"><b>' + (st.realMoney ? '<span style="color:var(--ok)">مفعّلة</span>' : '<span style="color:var(--muted)">مقفلة 🔒</span>') + '</b><span>الأموال الحقيقية</span></div>' +
        '<div class="stat money"><b>' + ['USD', 'ILS', 'JOD'].map(function (k) { return money((c.revenue || {})[k] || '0', k); }).join('<br>') + '</b><span>مبيعات من المحافظ</span></div></div>';
      var paidSum = {}; (c.topups || []).forEach(function (t) { if (t.status === 'paid') paidSum[t.currency] = t.total; });
      h += '<h2>الشحن بالبطاقة</h2><p class="sub">مدفوع: ' + (Object.keys(paidSum).map(function (k) { return money(paidSum[k], k); }).join(' · ') || '—') + '</p>';
      h += '<div class="list">' + (tops.length ? tops.map(function (t) {
        var s = TOPUP[t.status] || [t.status, 'p-mute'];
        return '<div class="row"><span class="pill ' + s[1] + '">' + esc(s[0]) + '</span><div class="main"><b>' + money(t.amount, t.currency) + (t.testMode ? ' <small style="display:inline;color:var(--muted)">(اختبار)</small>' : '') + '</b>' +
          '<small>' + esc(t.user && t.user.name) + ' <span class="ltr">' + esc(t.user && t.user.phone) + '</span> · ' + esc(when(t.createdAt)) + (t.error ? ' · ' + esc(t.error) : '') + '</small></div>' +
          '<span class="ltr" style="font-size:11px;color:var(--muted);max-width:140px;overflow:hidden;text-overflow:ellipsis">' + esc(t.stripeSessionId || '') + '</span></div>';
      }).join('') : '<div class="empty">ما في عمليات شحن بالبطاقة لسا.</div>') + '</div>';
      h += '<h2>مبيعات خدمات إليفوري من المحافظ</h2><div class="list">' + (orders.length ? orders.map(function (o) {
        return '<div class="row"><span class="pill p-ok">مدفوع</span><div class="main"><b>' + esc(o.label) + ' · ' + money(o.amount, o.currency) + '</b>' +
          '<small>' + esc(o.user && o.user.name) + ' <span class="ltr">' + esc(o.user && o.user.phone) + '</span> · ' + esc(when(o.createdAt)) + ' · <span class="ltr">' + esc(o.id) + '</span></small></div></div>';
      }).join('') : '<div class="empty">ما في مبيعات لسا.</div>') + '</div>';
      app.innerHTML = h;
    }).catch(fail);
  }

  // ------------------------------------------------------------- tabs
  var VIEWS = { overview: overview, users: users, entries: entries, commerce: commerce, audit: audit };
  function switchTab(tab) {
    state.tab = tab;
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === tab); });
    if (!token()) { fail(new Error('auth')); return; }
    VIEWS[tab]();
  }
  document.getElementById('tabs').addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (b) switchTab(b.getAttribute('data-tab')); });
  app.addEventListener('click', function (e) { var r = e.target.closest('[data-user]'); if (r) openUser(r.getAttribute('data-user')); });
  document.getElementById('refresh').onclick = function () { switchTab(state.tab); };
  switchTab('overview');
})();
</script>
</body>
</html>
